      // ---------- Focus & Keyboard Guard Helpers ----------
      function blurActiveElement() {
        try {
          const ae = document.activeElement;
          if (ae && ae !== document.body && typeof ae.blur === 'function') {
            ae.blur();
          }
        } catch (_) {}
      }

      function isEditableElementActive() {
        const ae = document.activeElement;
        if (!ae) return false;
        const tag = (ae.tagName || '').toUpperCase();
        if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return true;
        if (ae.isContentEditable) return true;
        return false;
      }

      // ---------- Exponential Rate & Integral Math ----------
      function evalExponentialRate(startVal, targetVal, dt, tau) {
        const safeTau = Math.max(0.0001, tau);
        const safeDt = Math.max(0, dt);
        return targetVal + (startVal - targetVal) * Math.exp(-safeDt / safeTau);
      }

      function integrateExponentialRate(startVal, targetVal, dt, tau) {
        const safeTau = Math.max(0.0001, tau);
        const safeDt = Math.max(0, dt);
        return targetVal * safeDt + (startVal - targetVal) * safeTau * (1 - Math.exp(-safeDt / safeTau));
      }

      function normalizeBufferOffset(offset, duration, looping) {
        if (!Number.isFinite(duration) || duration <= 0) return 0;
        if (looping) {
          const mod = offset % duration;
          return mod < 0 ? mod + duration : mod;
        }
        return clamp(offset, 0, duration);
      }

      function getCurrentRate(now) {
        if (playbackState === 'stopped') return 0;
        return evalExponentialRate(rateStartVal, rateTargetVal, now - rateStartTime, rateTau);
      }

      function getLiveBufferOffset(now) {
        if (!audioBuffer) return 0;
        if (playbackState === 'stopped') {
          return normalizeBufferOffset(anchorBufferOffset, audioBuffer.duration, settings.isLooping);
        }
        const delta = integrateExponentialRate(rateStartVal, rateTargetVal, now - rateStartTime, rateTau);
        return normalizeBufferOffset(anchorBufferOffset + delta, audioBuffer.duration, settings.isLooping);
      }

      function commitRateAnchor(now, newTarget, newTau) {
        const curRate = getCurrentRate(now);
        if (audioBuffer) {
          anchorBufferOffset = getLiveBufferOffset(now);
        }
        rateStartVal = curRate;
        rateTargetVal = newTarget;
        rateStartTime = now;
        rateTau = Math.max(0.005, newTau);
        return curRate;
      }

      function computeSpinDownTimes(currentRate, now, tau) {
        const safeTau = Math.max(0.005, tau);
        const safeCur = Math.max(MIN_RATE, currentRate);

        let dtFade = 0;
        if (safeCur > FADE_START_RATE) {
          dtFade = -safeTau * Math.log((FADE_START_RATE - MIN_RATE) / (safeCur - MIN_RATE));
        }

        let dtStop = 0;
        if (safeCur > STOP_THRESHOLD_RATE) {
          dtStop = -safeTau * Math.log((STOP_THRESHOLD_RATE - MIN_RATE) / (safeCur - MIN_RATE));
        }

        const tFade = now + Math.max(0, dtFade);
        const tStop = Math.max(tFade + 0.04, now + Math.max(0, dtStop));
        return { tFade, tStop };
      }

      // ---------- Piecewise Motor Gain Model ----------
      function getCurrentMotorGain(now) {
        if (!gainSegments || gainSegments.length === 0) return 1;
        let seg = gainSegments[gainSegments.length - 1];
        for (let i = 0; i < gainSegments.length; i++) {
          const s = gainSegments[i];
          const nextT = i + 1 < gainSegments.length ? gainSegments[i + 1].t0 : Infinity;
          if (now >= s.t0 && now < nextT) {
            seg = s;
            break;
          }
        }
        if (seg.type === 'const') return seg.v0;
        if (seg.type === 'linear') {
          if (now <= seg.t0) return seg.v0;
          if (now >= seg.t1) return seg.v1;
          const span = Math.max(0.0001, seg.t1 - seg.t0);
          return seg.v0 + (seg.v1 - seg.v0) * ((now - seg.t0) / span);
        }
        if (seg.type === 'exp') {
          return evalExponentialRate(seg.v0, seg.target, now - seg.t0, seg.tau);
        }
        return 1;
      }

      function setMotorGainTarget(now, target, tau) {
        const cur = getCurrentMotorGain(now);
        const safeTau = Math.max(0.005, tau);
        if (motorGain) {
          motorGain.gain.cancelScheduledValues(now);
          motorGain.gain.setValueAtTime(cur, now);
          motorGain.gain.setTargetAtTime(target, now, safeTau);
        }
        gainSegments = [{ type: 'exp', t0: now, v0: cur, target, tau: safeTau }];
      }

      function scheduleMotorSpinDownGain(now, tFade, tStop) {
        const cur = getCurrentMotorGain(now);
        const segs = [];
        if (motorGain) {
          motorGain.gain.cancelScheduledValues(now);
          motorGain.gain.setValueAtTime(cur, now);
        }

        if (tFade > now + 0.005) {
          if (cur < 0.999) {
            const tUp = Math.min(tFade, now + 0.03);
            if (motorGain) motorGain.gain.linearRampToValueAtTime(1.0, tUp);
            segs.push({ type: 'linear', t0: now, v0: cur, t1: tUp, v1: 1.0 });
            if (tFade > tUp) {
              if (motorGain) motorGain.gain.setValueAtTime(1.0, tFade);
              segs.push({ type: 'const', t0: tUp, v0: 1.0 });
            }
          } else {
            if (motorGain) motorGain.gain.setValueAtTime(1.0, tFade);
            segs.push({ type: 'const', t0: now, v0: 1.0 });
          }
          if (motorGain) motorGain.gain.linearRampToValueAtTime(0.0, tStop);
          segs.push({ type: 'linear', t0: tFade, v0: 1.0, t1: tStop, v1: 0.0 });
          segs.push({ type: 'const', t0: tStop, v0: 0.0 });
        } else {
          if (motorGain) motorGain.gain.linearRampToValueAtTime(0.0, tStop);
          segs.push({ type: 'linear', t0: now, v0: cur, t1: tStop, v1: 0.0 });
          segs.push({ type: 'const', t0: tStop, v0: 0.0 });
        }
        gainSegments = segs;
      }

      // ---------- Web Audio Initialization & Unlock ----------
      function ensureAudioContext() {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) {
          setStatusOverride('Web Audio非対応ブラウザです', 'err', 4000);
          return null;
        }

        if (!audioCtx) {
          audioCtx = new AudioCtx();
          motorGain = audioCtx.createGain();
          motorGain.gain.value = 0;

          analyser = audioCtx.createAnalyser();
          analyser.fftSize = 256;
          analyser.smoothingTimeConstant = 0.78;
          analyserData = new Uint8Array(analyser.frequencyBinCount);

          masterGain = audioCtx.createGain();
          masterGain.gain.value = 0.95;

          motorGain.connect(analyser);
          analyser.connect(masterGain);
          masterGain.connect(audioCtx.destination);

          if (typeof audioCtx.addEventListener === 'function') {
            audioCtx.addEventListener('statechange', updateAudioStatusUI);
          } else {
            audioCtx.onstatechange = updateAudioStatusUI;
          }
        }

        if (audioCtx.state === 'suspended' || audioCtx.state === 'interrupted') {
          try {
            const res = audioCtx.resume();
            if (res && typeof res.then === 'function') {
              res.then(() => updateAudioStatusUI()).catch(() => {});
            }
          } catch (_) {}
        }

        if (!isAudioUnlocked) {
          try {
            const silent = audioCtx.createBuffer(1, 1, audioCtx.sampleRate || 44100);
            const src = audioCtx.createBufferSource();
            src.buffer = silent;
            src.connect(audioCtx.destination);
            src.start(0);
            isAudioUnlocked = true;
          } catch (_) {}
        }

        updateAudioStatusUI();
        return audioCtx;
      }

      function decodeAudioDataSafe(ctx, arrayBuffer) {
        if (!arrayBuffer || arrayBuffer.byteLength === 0) {
          return Promise.reject(new Error('音声データが空です'));
        }
        return new Promise((resolve, reject) => {
          let settled = false;
          const finishOk = (decoded) => {
            if (settled) return;
            settled = true;
            resolve(decoded);
          };
          const finishErr = (err) => {
            if (settled) return;
            settled = true;
            reject(err || new Error('音声データのデコードに失敗しました'));
          };

          try {
            const maybePromise = ctx.decodeAudioData(
              arrayBuffer,
              finishOk,
              finishErr
            );
            if (maybePromise && typeof maybePromise.then === 'function') {
              maybePromise.then(finishOk, finishErr);
            }
          } catch (err) {
            finishErr(err);
          }
        });
      }

      // ---------- Built-in Demo Groove Synthesizer ----------
      function createDemoBuffer(ctx) {
        const sr = ctx.sampleRate || 44100;
        const duration = 4.0;
        const length = Math.floor(sr * duration);
        const buf = ctx.createBuffer(2, length, sr);
        const left = buf.getChannelData(0);
        const right = buf.getChannelData(1);

        const beatDur = 0.5;
        const eighthDur = 0.25;
        const bassFreqs = [55.0, 55.0, 110.0, 65.41, 73.42, 73.42, 146.83, 82.41];
        const chordRoots = [220.0, 220.0, 261.63, 293.66];

        let noiseSeed = 1337;
        const nextNoise = () => {
          noiseSeed = (noiseSeed * 1664525 + 1013904223) >>> 0;
          return (noiseSeed / 4294967296) * 2 - 1;
        };

        for (let i = 0; i < length; i++) {
          const t = i / sr;
          const beatIdx = Math.floor(t / beatDur);
          const beatLocal = t - beatIdx * beatDur;
          const eighthIdx = Math.floor(t / eighthDur);
          const eighthLocal = t - eighthIdx * eighthDur;
          const barBeat = beatIdx % 4;

          const kickFreq = 46 + 115 * Math.exp(-beatLocal * 28);
          const kickEnv = Math.exp(-beatLocal * 11);
          const kick = Math.sin(2 * Math.PI * kickFreq * beatLocal) * kickEnv * 0.55;

          const isOffHat = eighthIdx % 2 === 1;
          const hatEnv = isOffHat ? Math.exp(-eighthLocal * 38) : Math.exp(-eighthLocal * 65) * 0.25;
          const hatRaw = nextNoise();
          const hat = hatRaw * hatEnv * 0.16;

          const bassF = bassFreqs[eighthIdx % bassFreqs.length];
          const bassEnv = Math.exp(-eighthLocal * 7.5);
          const bassWave =
            Math.sin(2 * Math.PI * bassF * t) * 0.65 +
            Math.sin(4 * Math.PI * bassF * t) * 0.22 +
            Math.sin(6 * Math.PI * bassF * t) * 0.10;
          const bass = bassWave * bassEnv * 0.34;

          const root = chordRoots[Math.floor(beatIdx / 2) % chordRoots.length];
          const stabLocal = beatLocal;
          const stabEnv = (barBeat === 0 || barBeat === 2 ? 0.24 : 0.14) * Math.exp(-stabLocal * 4.5);
          const chordL =
            Math.sin(2 * Math.PI * root * t) +
            0.7 * Math.sin(2 * Math.PI * (root * 1.1892) * t) +
            0.6 * Math.sin(2 * Math.PI * (root * 1.4983) * t);
          const chordR =
            Math.sin(2 * Math.PI * root * t + 0.35) +
            0.7 * Math.sin(2 * Math.PI * (root * 1.1892) * t + 0.55) +
            0.6 * Math.sin(2 * Math.PI * (root * 1.4983) * t + 0.75);

          let seam = 1;
          const fadeSamples = Math.floor(sr * 0.003);
          if (i < fadeSamples) seam = i / fadeSamples;
          else if (i > length - fadeSamples) seam = (length - i) / fadeSamples;

          left[i] = clamp((kick + bass + chordL * stabEnv + hat * 0.85) * seam, -0.95, 0.95);
          right[i] = clamp((kick + bass + chordR * stabEnv + hat * 1.1) * seam, -0.95, 0.95);
        }

        return buf;
      }

      // ---------- Playback, Resource Cleanup & Unified Buffer Loader ----------
      function clearStopTimer() {
        if (stopTimerId !== null) {
          clearTimeout(stopTimerId);
          stopTimerId = null;
        }
      }

      function getTargetRateForMode(mode) {
        if (mode === 0) {
          return settings.zeroBehavior === 'normal' ? 1.0 : MIN_RATE;
        }
        return settings.rates[mode] || 1.0;
      }

      function detachSource(source) {
        if (!source) return;
        source.onended = null;
        try {
          source.stop(0);
        } catch (_) {}
        try {
          source.disconnect();
        } catch (_) {}
      }

      function releaseAudioResources() {
        immediateStop(true);
        audioBuffer = null;
      }

      function loadDecodedBuffer(decoded, meta, options = {}) {
        const { autoStart = false, forcePlayFromStandstill = false } = options;
        immediateStop(true);
        audioBuffer = decoded;
        isDemoLoaded = meta.sourceType === 'demo';
        el.demoBtn.classList.toggle('active', isDemoLoaded);

        currentTrackMeta = {
          title: meta.title || 'Untitled',
          artist: meta.artist || '',
          artwork: sanitizeArtworkUrl(meta.artwork),
          sourceType: meta.sourceType || 'local',
          trackId: meta.trackId ? String(meta.trackId) : null
        };

        updateNowPlayingUI();
        setStatusOverride(`再生準備完了 (${formatTime(decoded.duration)})`, 'ok', 2600);

        if (forcePlayFromStandstill) {
          if (activeMode === 0 && settings.zeroBehavior === 'stop') {
            activeMode = 1;
          }
          startPlaybackFromStandstill(getTargetRateForMode(activeMode));
        } else if (autoStart && !(activeMode === 0 && settings.zeroBehavior === 'stop')) {
          startPlaybackFromStandstill(getTargetRateForMode(activeMode));
        } else {
          updateUI();
        }
      }

      function finalizeSpinDownStop(expectedSource) {
        stopTimerId = null;
        if (expectedSource && expectedSource !== currentSource) return;

        const now = audioCtx ? audioCtx.currentTime : 0;
        if (audioBuffer) {
          anchorBufferOffset = getLiveBufferOffset(now);
        }
        detachSource(currentSource);
        currentSource = null;
        playbackState = 'stopped';
        rateStartVal = 0;
        rateTargetVal = 0;
        rateStartTime = now;
        if (motorGain && audioCtx) {
          motorGain.gain.cancelScheduledValues(now);
          motorGain.gain.setValueAtTime(0, now);
          gainSegments = [{ type: 'const', t0: now, v0: 0 }];
        }
        updateUI();
      }

      function immediateStop(resetOffset = false) {
        clearStopTimer();
        const now = audioCtx ? audioCtx.currentTime : 0;
        if (audioBuffer && playbackState !== 'stopped' && !resetOffset) {
          anchorBufferOffset = getLiveBufferOffset(now);
        }
        if (resetOffset) {
          anchorBufferOffset = 0;
        }
        if (currentSource) {
          const old = currentSource;
          currentSource = null;
          detachSource(old);
        }
        playbackState = 'stopped';
        rateStartVal = 0;
        rateTargetVal = 0;
        rateStartTime = now;
        if (motorGain && audioCtx) {
          motorGain.gain.cancelScheduledValues(now);
          motorGain.gain.setValueAtTime(0, now);
          gainSegments = [{ type: 'const', t0: now, v0: 0 }];
        }
        updateUI();
      }

      function rampPlaybackRate(newTarget, tau) {
        if (!audioCtx || !currentSource) return;
        const now = audioCtx.currentTime;
        const safeTarget = Math.max(MIN_RATE, newTarget);
        const safeTau = Math.max(0.005, tau);

        const current = Math.max(MIN_RATE, commitRateAnchor(now, safeTarget, safeTau));
        currentSource.playbackRate.cancelScheduledValues(now);
        currentSource.playbackRate.setValueAtTime(current, now);
        currentSource.playbackRate.setTargetAtTime(safeTarget, now, safeTau);
      }

      function startPlaybackFromStandstill(targetRate) {
        const ctx = ensureAudioContext();
        if (!ctx || !audioBuffer) return;

        clearStopTimer();
        if (currentSource) {
          detachSource(currentSource);
          currentSource = null;
        }

        const now = ctx.currentTime;
        const safeTarget = Math.max(MIN_RATE, targetRate);
        const safeTau = Math.max(0.005, settings.inertiaTau);
        const initialSpinRate = Math.min(0.08, safeTarget);

        if (!settings.isLooping && anchorBufferOffset >= audioBuffer.duration - 0.02) {
          anchorBufferOffset = 0;
        }
        let startOffset = normalizeBufferOffset(anchorBufferOffset, audioBuffer.duration, settings.isLooping);
        // Clamp slightly below exact duration to prevent boundary errors on Firefox
        startOffset = Math.max(0, Math.min(startOffset, Math.max(0, audioBuffer.duration - 0.001)));
        anchorBufferOffset = startOffset;

        const src = ctx.createBufferSource();
        src.buffer = audioBuffer;
        src.loop = settings.isLooping;
        src.playbackRate.setValueAtTime(initialSpinRate, now);
        src.playbackRate.setTargetAtTime(safeTarget, now, safeTau);
        src.connect(motorGain);

        src.onended = () => {
          if (src !== currentSource) return;
          currentSource = null;
          clearStopTimer();
          playbackState = 'stopped';
          anchorBufferOffset = 0;
          const endNow = audioCtx ? audioCtx.currentTime : 0;
          rateStartVal = 0;
          rateTargetVal = 0;
          rateStartTime = endNow;
          if (motorGain && audioCtx) {
            motorGain.gain.cancelScheduledValues(endNow);
            motorGain.gain.setValueAtTime(0, endNow);
            gainSegments = [{ type: 'const', t0: endNow, v0: 0 }];
          }
          updateUI();
        };

        currentSource = src;
        playbackState = 'playing';
        rateStartVal = initialSpinRate;
        rateTargetVal = safeTarget;
        rateStartTime = now;
        rateTau = safeTau;

        motorGain.gain.cancelScheduledValues(now);
        motorGain.gain.setValueAtTime(0, now);
        motorGain.gain.linearRampToValueAtTime(1.0, now + 0.04);
        gainSegments = [
          { type: 'linear', t0: now, v0: 0, t1: now + 0.04, v1: 1.0 },
          { type: 'const', t0: now + 0.04, v0: 1.0 }
        ];

        src.start(now, startOffset);
        updateUI();
      }

      function triggerSpinDownStop() {
        if (!audioCtx || !currentSource || playbackState === 'stopped') {
          playbackState = 'stopped';
          updateUI();
          return;
        }
        clearStopTimer();
        const now = audioCtx.currentTime;
        const safeTau = Math.max(0.005, settings.inertiaTau);
        const curRate = Math.max(MIN_RATE, commitRateAnchor(now, MIN_RATE, safeTau));

        currentSource.playbackRate.cancelScheduledValues(now);
        currentSource.playbackRate.setValueAtTime(curRate, now);
        currentSource.playbackRate.setTargetAtTime(MIN_RATE, now, safeTau);

        const { tFade, tStop } = computeSpinDownTimes(curRate, now, safeTau);
        scheduleMotorSpinDownGain(now, tFade, tStop);

        playbackState = 'stopping';
        const srcRef = currentSource;
        const delayMs = Math.max(60, (tStop - now) * 1000 + 30);
        stopTimerId = setTimeout(() => finalizeSpinDownStop(srcRef), delayMs);
        updateUI();
      }

      function selectMode(mode, sourceTag) {
        ensureAudioContext();
        activeMode = mode;

        if (!audioBuffer) {
          updateUI();
          if (mode !== 0 && sourceTag === 'pad') {
            pulseAudioButtons();
            setStatusOverride('「音源」「デモ」またはAudiusから曲を選んでください', 'warn', 2600);
          }
          return;
        }

        const isStopZero = mode === 0 && settings.zeroBehavior === 'stop';
        if (isStopZero) {
          if (playbackState === 'playing') {
            triggerSpinDownStop();
          } else {
            updateUI();
          }
          return;
        }

        const targetRate = getTargetRateForMode(mode);
        if (playbackState === 'stopped') {
          startPlaybackFromStandstill(targetRate);
        } else {
          clearStopTimer();
          playbackState = 'playing';
          const now = audioCtx.currentTime;
          setMotorGainTarget(now, 1.0, 0.025);
          rampPlaybackRate(targetRate, settings.inertiaTau);
          updateUI();
        }
      }

      function toggleMasterPlayStop() {
        ensureAudioContext();
        if (!audioBuffer) {
          pulseAudioButtons();
          setStatusOverride('先に「音源」「デモ」またはAudiusから曲を選んでください', 'warn', 2800);
          return;
        }

        if (playbackState === 'playing') {
          clearStopTimer();
          const now = audioCtx.currentTime;
          const curGain = getCurrentMotorGain(now);
          motorGain.gain.cancelScheduledValues(now);
          motorGain.gain.setValueAtTime(curGain, now);
          motorGain.gain.linearRampToValueAtTime(0, now + 0.04);
          gainSegments = [
            { type: 'linear', t0: now, v0: curGain, t1: now + 0.04, v1: 0 },
            { type: 'const', t0: now + 0.04, v0: 0 }
          ];
          playbackState = 'stopping';
          const srcRef = currentSource;
          stopTimerId = setTimeout(() => finalizeSpinDownStop(srcRef), 55);
          updateUI();
          return;
        }

        if (activeMode === 0 && settings.zeroBehavior === 'stop') {
          activeMode = 1;
        }
        const targetRate = getTargetRateForMode(activeMode);
        if (playbackState === 'stopping' && currentSource) {
          clearStopTimer();
          playbackState = 'playing';
          setMotorGainTarget(audioCtx.currentTime, 1.0, 0.025);
          rampPlaybackRate(targetRate, settings.inertiaTau);
          updateUI();
        } else {
          startPlaybackFromStandstill(targetRate);
        }
      }

      // ---------- Local File Loading & Demo Loading ----------
      function abortInFlightStreamLoad() {
        if (activeStreamAbortController) {
          try {
            activeStreamAbortController.abort();
          } catch (_) {}
          activeStreamAbortController = null;
        }
        loadingTrackId = null;
      }

      async function handleFileSelection(file) {
        if (!file) return;
        const ctx = ensureAudioContext();
        if (!ctx) return;

        const loadId = ++audioLoadSeq;
        abortInFlightStreamLoad();

        el.trackName.textContent = `読込中: ${file.name}`;
        el.trackName.classList.remove('loaded');
        el.trackArtist.textContent = 'ローカルファイル';
        setStatusOverride('音声をデコード中...', 'warn', 15000);

        try {
          releaseAudioResources();
          const arrayBuf = await readFileAsArrayBuffer(file);
          if (loadId !== audioLoadSeq) return;
          const decoded = await decodeAudioDataSafe(ctx, arrayBuf);
          if (loadId !== audioLoadSeq) return;

          loadDecodedBuffer(
            decoded,
            {
              title: file.name,
              artist: 'ローカルファイル',
              artwork: PLACEHOLDER_ART_URI,
              sourceType: 'local',
              trackId: null
            },
            { autoStart: true }
          );
        } catch (err) {
          if (loadId !== audioLoadSeq) return;
          updateNowPlayingUI();
          setStatusOverride(`音声のデコードに失敗しました (${err && err.message ? err.message : '非対応形式'})`, 'err', 4500);
        }
      }

      function readFileAsArrayBuffer(file) {
        if (typeof file.arrayBuffer === 'function') {
          return file.arrayBuffer();
        }
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.onerror = () => reject(reader.error || new Error('File read failed'));
          reader.readAsArrayBuffer(file);
        });
      }

      function loadDemoAudio() {
        const ctx = ensureAudioContext();
        if (!ctx) return;

        ++audioLoadSeq;
        abortInFlightStreamLoad();
        releaseAudioResources();

        const buf = createDemoBuffer(ctx);
        loadDecodedBuffer(
          buf,
          {
            title: 'Demo Synth Groove (120 BPM)',
            artist: '内蔵デモ音源',
            artwork: PLACEHOLDER_ART_URI,
            sourceType: 'demo',
            trackId: null
          },
          { forcePlayFromStandstill: true }
        );
        renderCurrentLists();
      }

      // ---------- Audius API Discovery, Search, Stream & Retry ----------
      function makeAbortError() {
        const err = new Error('Aborted');
        err.name = 'AbortError';
        return err;
      }

      function normalizeHostUrl(raw) {
        if (typeof raw !== 'string') return null;
        const trimmed = raw.trim().replace(/\/+$/, '');
        if (!/^https:\/\//i.test(trimmed)) return null;
        return trimmed;
      }

      function shuffleArray(arr) {
        const copy = arr.slice();
        for (let i = copy.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          const tmp = copy[i];
          copy[i] = copy[j];
          copy[j] = tmp;
        }
        return copy;
      }

      async function getAudiusHosts(signal) {
        if (Array.isArray(audiusHosts) && audiusHosts.length > 0) {
          return audiusHosts;
        }
        try {
          const res = await fetch(AUDIUS_DISCOVERY_API, {
            mode: 'cors',
            redirect: 'follow',
            signal
          });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const json = await res.json();
          const rawList = Array.isArray(json && json.data) ? json.data : [];
          const unique = [];
          const seen = new Set();
          for (const item of rawList) {
            const norm = normalizeHostUrl(item);
            if (norm && !seen.has(norm)) {
              seen.add(norm);
              unique.push(norm);
            }
          }
          const shuffled = shuffleArray(unique);
          if (!seen.has(AUDIUS_FALLBACK_HOST)) {
            shuffled.push(AUDIUS_FALLBACK_HOST);
          }
          audiusHosts = shuffled.length > 0 ? shuffled : [AUDIUS_FALLBACK_HOST];
          audiusHostIndex = 0;
          return audiusHosts;
        } catch (err) {
          if (err && err.name === 'AbortError') throw err;
          audiusHosts = [AUDIUS_FALLBACK_HOST];
          audiusHostIndex = 0;
          return audiusHosts;
        }
      }

      function buildHostCandidates(hosts, maxAttempts) {
        const list = Array.isArray(hosts) && hosts.length > 0 ? hosts : [AUDIUS_FALLBACK_HOST];
        const out = [];
        const seen = new Set();
        const start = audiusHostIndex % list.length;
        for (let i = 0; i < list.length && out.length < maxAttempts; i++) {
          const h = list[(start + i) % list.length];
          if (!seen.has(h)) {
            seen.add(h);
            out.push(h);
          }
        }
        if (!seen.has(AUDIUS_FALLBACK_HOST)) {
          if (out.length >= maxAttempts) {
            out[out.length - 1] = AUDIUS_FALLBACK_HOST;
          } else {
            out.push(AUDIUS_FALLBACK_HOST);
          }
        }
        return out;
      }

      async function fetchAudiusJson(buildUrl, signal) {
        const hosts = await getAudiusHosts(signal);
        // Initial attempt + up to 3 fallbacks = max 4 attempts
        const candidates = buildHostCandidates(hosts, 4);
        let lastErr = null;

        for (let i = 0; i < candidates.length; i++) {
          if (signal && signal.aborted) throw makeAbortError();
          const host = candidates[i];
          const url = buildUrl(host);
          try {
            const res = await fetch(url, {
              mode: 'cors',
              redirect: 'follow',
              signal
            });
            if (!res.ok) {
              throw new Error(`HTTP ${res.status}`);
            }
            const json = await res.json();
            if (!json || typeof json !== 'object') {
              throw new Error('不正なAPIレスポンスです');
            }
            const idx = hosts.indexOf(host);
            if (idx >= 0) audiusHostIndex = idx;
            return json;
          } catch (err) {
            if (err && err.name === 'AbortError') throw err;
            lastErr = err;
          }
        }
        throw lastErr || new Error('Audius APIへの接続に失敗しました');
      }

      function filterPlayableTracks(rawData) {
        if (!Array.isArray(rawData)) return [];
        const result = [];
        for (const t of rawData) {
          if (!t || !t.id) continue;
          if (t.is_streamable === false) continue;
          if (t.access && t.access.stream === false) continue;
          if (t.stream_conditions != null) continue;
          const norm = normalizeTrack(t);
          if (norm) result.push(norm);
        }
        return result;
      }

      async function fetchTrendingByPreset(preset) {
        if (activeListAbortController) {
          try {
            activeListAbortController.abort();
          } catch (_) {}
        }
        const controller = new AbortController();
        activeListAbortController = controller;

        activePresetId = preset.id;
        renderPresetChips();
        setListStatus(el.audiusListStatus, `${preset.label} を取得中...`, '');

        try {
          const json = await fetchAudiusJson((host) => {
            const genreParam = preset.genre ? `genre=${encodeURIComponent(preset.genre)}&` : '';
            return `${host}/v1/tracks/trending?${genreParam}time=week&app_name=${AUDIUS_APP_NAME}`;
          }, controller.signal);

          if (controller.signal.aborted) return;

          let tracks = filterPlayableTracks(json.data);
          // If a specific genre label returns empty on trending, fall back to search query
          if (tracks.length === 0 && preset.fallbackQuery) {
            const fallbackJson = await fetchAudiusJson(
              (host) => `${host}/v1/tracks/search?query=${encodeURIComponent(preset.fallbackQuery)}&app_name=${AUDIUS_APP_NAME}`,
              controller.signal
            );
            if (controller.signal.aborted) return;
            tracks = filterPlayableTracks(fallbackJson.data);
          }

          audiusTracks = tracks;
          renderTrackList(el.audiusTrackList, audiusTracks, el.audiusListStatus, '再生可能な楽曲が見つかりませんでした');
          setListStatus(
            el.audiusListStatus,
            `${preset.label}: ${tracks.length}曲`,
            tracks.length > 0 ? 'ok' : ''
          );
        } catch (err) {
          if (err && err.name === 'AbortError') return;
          audiusTracks = [];
          renderTrackList(el.audiusTrackList, audiusTracks, el.audiusListStatus, '楽曲リストを取得できませんでした');
          setListStatus(el.audiusListStatus, `取得エラー: ${err && err.message ? err.message : '通信に失敗しました'}`, 'err');
        }
      }

      async function searchAudiusTracks(query) {
        const trimmed = (query || '').trim();
        if (!trimmed) {
          const preset = PRESET_GENRES.find((p) => p.id === activePresetId) || PRESET_GENRES[0];
          return fetchTrendingByPreset(preset);
        }

        if (activeListAbortController) {
          try {
            activeListAbortController.abort();
          } catch (_) {}
        }
        const controller = new AbortController();
        activeListAbortController = controller;

        activePresetId = '';
        renderPresetChips();
        setListStatus(el.audiusListStatus, `「${trimmed}」を検索中...`, '');

        try {
          const json = await fetchAudiusJson(
            (host) => `${host}/v1/tracks/search?query=${encodeURIComponent(trimmed)}&app_name=${AUDIUS_APP_NAME}`,
            controller.signal
          );
          if (controller.signal.aborted) return;

          audiusTracks = filterPlayableTracks(json.data);
          renderTrackList(el.audiusTrackList, audiusTracks, el.audiusListStatus, '該当する再生可能な楽曲がありません');
          setListStatus(
            el.audiusListStatus,
            `検索結果: ${audiusTracks.length}曲`,
            audiusTracks.length > 0 ? 'ok' : ''
          );
        } catch (err) {
          if (err && err.name === 'AbortError') return;
          audiusTracks = [];
          renderTrackList(el.audiusTrackList, audiusTracks, el.audiusListStatus, '検索に失敗しました');
          setListStatus(el.audiusListStatus, `検索エラー: ${err && err.message ? err.message : '通信に失敗しました'}`, 'err');
        }
      }

      async function readResponseWithProgress(res, signal, onProgress) {
        const totalHeader = res.headers && typeof res.headers.get === 'function'
          ? res.headers.get('content-length')
          : null;
        const totalBytes = totalHeader ? parseInt(totalHeader, 10) : 0;

        if (!res.body || typeof res.body.getReader !== 'function') {
          const buf = await res.arrayBuffer();
          onProgress(100, buf.byteLength, buf.byteLength);
          return buf;
        }

        const reader = res.body.getReader();
        const chunks = [];
        let loadedBytes = 0;

        while (true) {
          if (signal && signal.aborted) {
            try {
              await reader.cancel();
            } catch (_) {}
            throw makeAbortError();
          }
          const { done, value } = await reader.read();
          if (done) break;
          if (value && value.byteLength > 0) {
            chunks.push(value);
            loadedBytes += value.byteLength;
            const pct = totalBytes > 0 ? Math.min(100, Math.round((loadedBytes / totalBytes) * 100)) : null;
            onProgress(pct, loadedBytes, totalBytes);
          }
        }

        const merged = new Uint8Array(loadedBytes);
        let offset = 0;
        for (const chunk of chunks) {
          merged.set(chunk, offset);
          offset += chunk.byteLength;
        }
        return merged.buffer;
      }

      async function fetchAudiusStreamBuffer(trackId, signal, onProgress) {
        const hosts = await getAudiusHosts(signal);
        // Initial attempt + up to 2 automatic retries on different cached nodes = max 3 attempts
        const candidates = buildHostCandidates(hosts, 3);
        let lastErr = null;

        for (let i = 0; i < candidates.length; i++) {
          if (signal && signal.aborted) throw makeAbortError();
          const host = candidates[i];
          const streamUrl = `${host}/v1/tracks/${encodeURIComponent(trackId)}/stream?app_name=${AUDIUS_APP_NAME}`;
          try {
            const res = await fetch(streamUrl, {
              mode: 'cors',
              redirect: 'follow',
              signal
            });
            if (!res.ok) {
              throw new Error(`HTTP ${res.status}`);
            }
            const buf = await readResponseWithProgress(res, signal, onProgress);
            if (!buf || buf.byteLength === 0) {
              throw new Error('音声ストリームが空でした');
            }
            const idx = hosts.indexOf(host);
            if (idx >= 0) audiusHostIndex = idx;
            return buf;
          } catch (err) {
            if (err && err.name === 'AbortError') throw err;
            lastErr = err;
            if (i + 1 < candidates.length) {
              setStatusOverride(`別ノードで再試行中 (${i + 2}/${candidates.length})...`, 'warn', 10000);
            }
          }
        }
        throw lastErr || new Error('音声ストリームの取得に失敗しました');
      }

      async function loadAudiusTrack(track) {
        // Must run synchronously at the very start of the tap handler before any await/fetch
        const ctx = ensureAudioContext();
        blurActiveElement();

        if (!track || !track.id) return;
        if (!ctx) return;

        if (Number(track.duration) > MAX_AUDIUS_DURATION_SEC) {
          const msg = '15分以上の曲はメモリ保護のため非対応です';
          setStatusOverride(msg, 'err', 4500);
          setListStatus(el.audiusListStatus, msg, 'err');
          setListStatus(el.favListStatus, msg, 'err');
          return;
        }

        const loadId = ++audioLoadSeq;
        abortInFlightStreamLoad();

        const controller = new AbortController();
        activeStreamAbortController = controller;
        loadingTrackId = track.id;

        // Free previous playback & AudioBuffer before downloading/decoding next track
        releaseAudioResources();

        currentTrackMeta = {
          title: track.title,
          artist: track.artist,
          artwork: sanitizeArtworkUrl(track.artwork),
          sourceType: 'audius',
          trackId: track.id
        };
        updateNowPlayingUI(true);
        renderCurrentLists();

        const startMsg = `ダウンロード中 0% — ${track.title}`;
        setStatusOverride(startMsg, 'warn', 60000);
        setListStatus(el.audiusListStatus, 'ダウンロード準備中...', '');
        setListStatus(el.favListStatus, 'ダウンロード準備中...', '');

        try {
          const arrayBuf = await fetchAudiusStreamBuffer(track.id, controller.signal, (pct, loadedBytes) => {
            if (loadId !== audioLoadSeq || controller.signal.aborted) return;
            const label = pct !== null
              ? `ダウンロード中 ${pct}%`
              : `ダウンロード中 ${(loadedBytes / (1024 * 1024)).toFixed(1)}MB`;
            setStatusOverride(label, 'warn', 60000);
          });

          if (loadId !== audioLoadSeq || controller.signal.aborted) return;

          setStatusOverride('デコード中...', 'warn', 30000);
          const decoded = await decodeAudioDataSafe(ctx, arrayBuf);

          if (loadId !== audioLoadSeq || controller.signal.aborted) return;

          if (decoded.duration > MAX_AUDIUS_DURATION_SEC) {
            const msg = '15分以上の曲はメモリ保護のため非対応です';
            setStatusOverride(msg, 'err', 4500);
            setListStatus(el.audiusListStatus, msg, 'err');
            setListStatus(el.favListStatus, msg, 'err');
            return;
          }

          loadDecodedBuffer(
            decoded,
            {
              title: track.title,
              artist: track.artist,
              artwork: track.artwork,
              sourceType: 'audius',
              trackId: track.id
            },
            { forcePlayFromStandstill: true }
          );

          setListStatus(el.audiusListStatus, `再生準備完了: ${track.title}`, 'ok');
          setListStatus(el.favListStatus, `再生準備完了: ${track.title}`, 'ok');
        } catch (err) {
          if (err && err.name === 'AbortError') return;
          if (loadId !== audioLoadSeq) return;
          const reason = err && err.message ? err.message : '通信またはデコードエラー';
          const errMsg = `読込失敗: ${reason}`;
          setStatusOverride(errMsg, 'err', 5000);
          setListStatus(el.audiusListStatus, errMsg, 'err');
          setListStatus(el.favListStatus, errMsg, 'err');
        } finally {
          if (loadId === audioLoadSeq) {
            loadingTrackId = null;
            if (activeStreamAbortController === controller) {
              activeStreamAbortController = null;
            }
            updateNowPlayingUI(false);
            renderCurrentLists();
          }
        }
      }

      function pickRandomTrackFromList(list, statusEl) {
        ensureAudioContext();
        blurActiveElement();

        const playable = (list || []).filter((t) => Number(t.duration) <= MAX_AUDIUS_DURATION_SEC);
        if (playable.length === 0) {
          setListStatus(statusEl, '再生可能な15分未満の曲がリストにありません', 'err');
          return;
        }
        let pool = playable;
        if (playable.length > 1 && currentTrackMeta.trackId) {
          const withoutCurrent = playable.filter((t) => t.id !== currentTrackMeta.trackId);
          if (withoutCurrent.length > 0) pool = withoutCurrent;
        }
        const chosen = pool[Math.floor(Math.random() * pool.length)];
        loadAudiusTrack(chosen);
      }

      // ---------- UI Rendering (Strict XSS-Safe DOM Construction) ----------
      function setListStatus(node, msg, level) {
        if (!node) return;
        node.textContent = msg || '';
        node.className = `list-status ${level || ''}`.trim();
      }

      function renderPresetChips() {
        el.audiusChipsRow.textContent = '';
        for (const preset of PRESET_GENRES) {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = `chip-btn${activePresetId === preset.id ? ' is-active' : ''}`;
          btn.textContent = preset.label;
          btn.addEventListener('click', () => {
            ensureAudioContext();
            blurActiveElement();
            el.audiusSearchInput.value = '';
            fetchTrendingByPreset(preset);
          });
          el.audiusChipsRow.appendChild(btn);
        }
      }

      function renderTrackList(container, tracks, statusEl, emptyMessage) {
        container.textContent = '';
        if (!Array.isArray(tracks) || tracks.length === 0) {
          const emptyDiv = document.createElement('div');
          emptyDiv.className = 'empty-state';
          emptyDiv.textContent = emptyMessage;
          container.appendChild(emptyDiv);
          return;
        }

        const frag = document.createDocumentFragment();
        for (const track of tracks) {
          const isTooLong = Number(track.duration) > MAX_AUDIUS_DURATION_SEC;
          const isLoading = loadingTrackId === track.id;
          const isCurrent = !isLoading && currentTrackMeta.sourceType === 'audius' && currentTrackMeta.trackId === track.id;
          const isFav = isFavoriteTrack(track.id);

          const row = document.createElement('div');
          row.className = 'track-row';
          row.setAttribute('role', 'listitem');
          row.tabIndex = 0;
          if (isCurrent) row.classList.add('is-playing');
          if (isLoading) row.classList.add('is-loading');
          if (isTooLong) row.classList.add('is-too-long');

          const img = document.createElement('img');
          img.className = 'row-art';
          img.alt = '';
          img.loading = 'lazy';
          img.src = sanitizeArtworkUrl(track.artwork);
          img.addEventListener('error', () => {
            if (img.src !== PLACEHOLDER_ART_URI) img.src = PLACEHOLDER_ART_URI;
          });

          const main = document.createElement('div');
          main.className = 'row-main';

          const titleEl = document.createElement('div');
          titleEl.className = 'row-title';
          titleEl.textContent = track.title;

          const subEl = document.createElement('div');
          subEl.className = 'row-sub';

          const artistEl = document.createElement('span');
          artistEl.className = 'row-artist';
          artistEl.textContent = track.artist;

          const durEl = document.createElement('span');
          durEl.className = 'row-dur';
          durEl.textContent = formatTime(track.duration);

          subEl.appendChild(artistEl);
          if (isTooLong) {
            const warnBadge = document.createElement('span');
            warnBadge.className = 'row-warn-badge';
            warnBadge.textContent = '15分超';
            subEl.appendChild(warnBadge);
          }
          subEl.appendChild(durEl);

          main.appendChild(titleEl);
          main.appendChild(subEl);

          const favBtn = document.createElement('button');
          favBtn.type = 'button';
          favBtn.className = `fav-btn${isFav ? ' is-fav' : ''}`;
          favBtn.setAttribute('aria-label', isFav ? 'お気に入り解除' : 'お気に入り追加');
          favBtn.textContent = isFav ? '★' : '☆';
          favBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            ensureAudioContext();
            blurActiveElement();
            toggleFavorite(track);
          });

          const triggerSelect = () => {
            loadAudiusTrack(track);
          };

          row.addEventListener('click', triggerSelect);
          row.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
              e.preventDefault();
              triggerSelect();
            }
          });

          row.appendChild(img);
          row.appendChild(main);
          row.appendChild(favBtn);
          frag.appendChild(row);
        }

        container.appendChild(frag);
      }

      function updateFavoritesUI() {
        el.tabFavBtn.textContent = `★ お気に入り (${favorites.length})`;
        renderTrackList(
          el.favTrackList,
          favorites,
          el.favListStatus,
          'お気に入りはまだありません。Audiusタブの「☆」ボタンで保存できます。'
        );
      }

      function renderCurrentLists() {
        renderTrackList(el.audiusTrackList, audiusTracks, el.audiusListStatus, '再生可能な楽曲が見つかりませんでした');
        updateFavoritesUI();
      }

      function switchTab(tabName) {
        ensureAudioContext();
        blurActiveElement();
        activeTab = tabName;

        el.tabMixerBtn.classList.toggle('is-active', tabName === 'mixer');
        el.tabAudiusBtn.classList.toggle('is-active', tabName === 'audius');
        el.tabFavBtn.classList.toggle('is-active', tabName === 'favorites');

        el.tabViewMixer.classList.toggle('is-hidden', tabName !== 'mixer');
        el.tabViewAudius.classList.toggle('is-hidden', tabName !== 'audius');
        el.tabViewFavorites.classList.toggle('is-hidden', tabName !== 'favorites');

        if (tabName === 'audius' && !hasInitializedAudius) {
          hasInitializedAudius = true;
          fetchTrendingByPreset(PRESET_GENRES[0]);
        }
      }

      function updateNowPlayingUI(isLoadingNow = false) {
        el.nowPlayingArt.src = sanitizeArtworkUrl(currentTrackMeta.artwork);
        el.trackName.textContent = isLoadingNow ? `読込中: ${currentTrackMeta.title}` : currentTrackMeta.title;
        el.trackName.classList.toggle('loaded', Boolean(audioBuffer) && !isLoadingNow);
        el.trackArtist.textContent = currentTrackMeta.artist || '';
      }

      // ---------- UI Helpers ----------
      function pulseAudioButtons() {
        el.fileLabel.classList.add('needs-audio');
        el.demoBtn.classList.add('needs-audio');
        setTimeout(() => {
          el.fileLabel.classList.remove('needs-audio');
          el.demoBtn.classList.remove('needs-audio');
        }, 900);
      }

      function setStatusOverride(msg, level, durationMs) {
        statusOverride = { msg, level };
        if (statusOverrideTimer) clearTimeout(statusOverrideTimer);
        updateAudioStatusUI();
        if (durationMs > 0) {
          statusOverrideTimer = setTimeout(() => {
            statusOverride = null;
            updateAudioStatusUI();
          }, durationMs);
        }
      }

      function updateAudioStatusUI() {
        if (statusOverride) {
          el.audioStatusText.textContent = statusOverride.msg;
          el.audioStatusText.className = `audio-status ${statusOverride.level || ''}`;
          return;
        }
        if (!audioCtx) {
          el.audioStatusText.textContent = 'AUDIO: TAP TO UNLOCK';
          el.audioStatusText.className = 'audio-status warn';
          el.statusLed.className = 'status-led';
          return;
        }
        const st = audioCtx.state;
        if (st === 'running') {
          el.audioStatusText.textContent = audioBuffer ? 'AUDIO: RUNNING' : 'AUDIO: READY';
          el.audioStatusText.className = 'audio-status ok';
          el.statusLed.className = playbackState === 'stopped' ? 'status-led running' : 'status-led playing';
        } else if (st === 'suspended' || st === 'interrupted') {
          el.audioStatusText.textContent = `AUDIO: ${st.toUpperCase()} (TAP)`;
          el.audioStatusText.className = 'audio-status warn';
          el.statusLed.className = 'status-led';
        } else {
          el.audioStatusText.textContent = `AUDIO: ${st.toUpperCase()}`;
          el.audioStatusText.className = 'audio-status';
          el.statusLed.className = 'status-led';
        }
      }

      function updateActiveAccentCss() {
        let color = 'var(--accent-0-stop)';
        if (activeMode === 0) {
          color = settings.zeroBehavior === 'normal' ? 'var(--accent-0-norm)' : 'var(--accent-0-stop)';
        } else if (activeMode === 1) {
          color = 'var(--accent-1)';
        } else if (activeMode === 2) {
          color = 'var(--accent-2)';
        } else if (activeMode === 3) {
          color = 'var(--accent-3)';
        }
        document.documentElement.style.setProperty('--active-color', color);
      }

      function formatTime(sec) {
        if (!Number.isFinite(sec) || sec < 0) return '00:00';
        const total = Math.floor(sec);
        const m = Math.floor(total / 60);
        const s = total % 60;
        return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
      }

      function updateUI() {
        updateActiveAccentCss();
        updateAudioStatusUI();

        el.pads[0].classList.toggle('is-normal-zero', settings.zeroBehavior === 'normal');
        for (let m = 0; m < 4; m++) {
          el.pads[m].classList.toggle('is-active', activeMode === m);
        }

        for (const btn of el.miniModeBtns) {
          const m = Number(btn.getAttribute('data-mini-mode'));
          btn.classList.toggle('is-active', m === activeMode);
        }

        el.padRates[0].textContent = settings.zeroBehavior === 'normal' ? '1.00x' : '減速停止';
        el.padRates[1].textContent = `${settings.rates[1].toFixed(2)}x`;
        el.padRates[2].textContent = `${settings.rates[2].toFixed(2)}x`;
        el.padRates[3].textContent = `${settings.rates[3].toFixed(2)}x`;

        const meta = MODE_META[activeMode];
        el.activeModeBadge.textContent = `[${activeMode}] ${meta.ja} / ${meta.en}`;
        if (activeMode === 0 && settings.zeroBehavior === 'stop') {
          el.targetRateText.textContent = playbackState === 'stopping' ? 'TARGET: BRAKING' : 'TARGET: STOP';
        } else {
          el.targetRateText.textContent = `TARGET: ${getTargetRateForMode(activeMode).toFixed(2)}x`;
        }

        const isPlayVisual = playbackState === 'playing';
        el.playStopBtn.textContent = isPlayVisual ? '■' : '▶';
        el.playStopBtn.classList.toggle('is-playing', isPlayVisual);

        el.loopToggleBtn.textContent = settings.isLooping ? 'LOOP: ON' : 'LOOP: OFF';
        el.loopToggleBtn.classList.toggle('is-on', settings.isLooping);

        if (settings.zeroBehavior === 'normal') {
          el.zeroModeToggleBtn.textContent = '0(切): 1.0x通常';
          el.zeroModeToggleBtn.classList.add('zero-normal');
          el.zeroModeToggleBtn.classList.remove('zero-stop');
        } else {
          el.zeroModeToggleBtn.textContent = '0(切): 減速停止';
          el.zeroModeToggleBtn.classList.add('zero-stop');
          el.zeroModeToggleBtn.classList.remove('zero-normal');
        }

        el.slider1.value = settings.rates[1].toFixed(2);
        el.slider2.value = settings.rates[2].toFixed(2);
        el.slider3.value = settings.rates[3].toFixed(2);
        el.sliderTau.value = settings.inertiaTau.toFixed(2);

        el.val1.textContent = `${settings.rates[1].toFixed(2)}x`;
        el.val2.textContent = `${settings.rates[2].toFixed(2)}x`;
        el.val3.textContent = `${settings.rates[3].toFixed(2)}x`;
        el.valTau.textContent = `${settings.inertiaTau.toFixed(2)}s`;
      }

      // ---------- Animation Frame Loop (Meters, Rotor, Progress) ----------
      function renderLoop(perfNow) {
        const dtPerf = Math.min(0.1, Math.max(0, (perfNow - lastFramePerf) / 1000));
        lastFramePerf = perfNow;

        const audioNow = audioCtx ? audioCtx.currentTime : 0;
        const currentRate = playbackState === 'stopped' ? 0 : getCurrentRate(audioNow);

        const rateStr = currentRate.toFixed(2);
        el.liveRateText.textContent = rateStr;
        const miniText = `[${activeMode} ${MODE_META[activeMode].ja}] ${rateStr}x`;
        el.audiusMiniRate.textContent = miniText;
        el.favMiniRate.textContent = miniText;

        const ratio = clamp(currentRate / TACHO_MAX_RATE, 0, 1);
        const dashOffset = TACHO_ARC_LEN * (1 - ratio);
        el.tachoArc.setAttribute('stroke-dashoffset', dashOffset.toFixed(1));
        const needleDeg = -135 + ratio * 270;
        el.needleGroup.setAttribute('transform', `rotate(${needleDeg.toFixed(1)} 60 60)`);

        if (currentRate > 0.002) {
          rotorAngle = (rotorAngle + currentRate * dtPerf * 240) % 360;
          el.rotorGroup.setAttribute('transform', `rotate(${rotorAngle.toFixed(1)} 60 60)`);
        }

        let level = 0;
        if (analyser && analyserData && playbackState !== 'stopped') {
          analyser.getByteTimeDomainData(analyserData);
          let sumSq = 0;
          for (let i = 0; i < analyserData.length; i++) {
            const norm = (analyserData[i] - 128) / 128;
            sumSq += norm * norm;
          }
          const rms = Math.sqrt(sumSq / analyserData.length);
          level = clamp(rms * 2.4, 0, 1);
        }
        el.audioRing.setAttribute('stroke-dashoffset', (RING_LEN * (1 - level)).toFixed(1));

        if (audioBuffer) {
          const pos = getLiveBufferOffset(audioNow);
          const dur = audioBuffer.duration;
          const pct = dur > 0 ? clamp((pos / dur) * 100, 0, 100) : 0;
          el.progressFill.style.width = `${pct.toFixed(1)}%`;
          el.timeReadout.textContent = `${formatTime(pos)} / ${formatTime(dur)}`;
        } else {
          el.progressFill.style.width = '0%';
          el.timeReadout.textContent = '00:00 / 00:00';
        }

        requestAnimationFrame(renderLoop);
      }

      // ---------- Event Wiring ----------
      function bindSlider(sliderEl, modeNum) {
        sliderEl.addEventListener('input', () => {
          ensureAudioContext();
          const val = clamp(parseFloat(sliderEl.value), 0.25, 3.0);
          settings.rates[modeNum] = val;
          saveSettings();
          updateUI();

          if (activeMode === modeNum && playbackState === 'playing' && currentSource) {
            rampPlaybackRate(val, Math.min(settings.inertiaTau, 0.04));
          }
        });
        sliderEl.addEventListener('change', blurActiveElement);
      }

      bindSlider(el.slider1, 1);
      bindSlider(el.slider2, 2);
      bindSlider(el.slider3, 3);

      el.sliderTau.addEventListener('input', () => {
        ensureAudioContext();
        const val = clamp(parseFloat(el.sliderTau.value), 0.02, 1.5);
        settings.inertiaTau = val;
        saveSettings();
        updateUI();

        if (playbackState === 'playing' && currentSource) {
          rampPlaybackRate(getTargetRateForMode(activeMode), val);
        } else if (playbackState === 'stopping' && currentSource && activeMode === 0 && settings.zeroBehavior === 'stop') {
          triggerSpinDownStop();
        }
      });
      el.sliderTau.addEventListener('change', blurActiveElement);

      el.resetBtn.addEventListener('click', () => {
        ensureAudioContext();
        blurActiveElement();
        settings = cloneDefaults();
        saveSettings();
        updateUI();
        if (playbackState === 'playing' && currentSource) {
          rampPlaybackRate(getTargetRateForMode(activeMode), settings.inertiaTau);
        } else if (playbackState === 'stopping' && currentSource && activeMode === 0 && settings.zeroBehavior === 'stop') {
          triggerSpinDownStop();
        }
      });

      el.loopToggleBtn.addEventListener('click', () => {
        ensureAudioContext();
        blurActiveElement();
        if (audioCtx && audioBuffer && playbackState !== 'stopped') {
          commitRateAnchor(audioCtx.currentTime, rateTargetVal, rateTau);
        }
        settings.isLooping = !settings.isLooping;
        if (currentSource) {
          currentSource.loop = settings.isLooping;
        }
        saveSettings();
        updateUI();
      });

      el.zeroModeToggleBtn.addEventListener('click', () => {
        ensureAudioContext();
        blurActiveElement();
        settings.zeroBehavior = settings.zeroBehavior === 'stop' ? 'normal' : 'stop';
        saveSettings();
        updateUI();
        if (activeMode === 0) {
          selectMode(0, 'toggle');
        }
      });

      el.fileLabel.addEventListener('pointerdown', () => ensureAudioContext());
      el.fileLabel.addEventListener('click', () => ensureAudioContext());
      el.fileInput.addEventListener('change', (e) => {
        const file = e.target.files && e.target.files[0];
        if (file) {
          handleFileSelection(file);
        }
        e.target.value = '';
        blurActiveElement();
      });

      el.demoBtn.addEventListener('click', () => {
        blurActiveElement();
        loadDemoAudio();
      });
      el.playStopBtn.addEventListener('click', () => {
        blurActiveElement();
        toggleMasterPlayStop();
      });

      // Tab buttons
      el.tabMixerBtn.addEventListener('click', () => switchTab('mixer'));
      el.tabAudiusBtn.addEventListener('click', () => switchTab('audius'));
      el.tabFavBtn.addEventListener('click', () => switchTab('favorites'));

      // Audius search & random
      el.audiusSearchForm.addEventListener('submit', (e) => {
        e.preventDefault();
        ensureAudioContext();
        blurActiveElement();
        searchAudiusTracks(el.audiusSearchInput.value);
      });

      el.audiusRandomBtn.addEventListener('click', () => {
        pickRandomTrackFromList(audiusTracks, el.audiusListStatus);
      });

      el.favRandomBtn.addEventListener('click', () => {
        pickRandomTrackFromList(favorites, el.favListStatus);
      });

      // Large 2x2 Mode Pads
      for (let m = 0; m < 4; m++) {
        const pad = el.pads[m];
        let lastPointerTriggerAt = 0;
        pad.addEventListener('pointerdown', (e) => {
          e.preventDefault();
          blurActiveElement();
          lastPointerTriggerAt = performance.now();
          selectMode(m, 'pad');
        });
        pad.addEventListener('click', () => {
          if (performance.now() - lastPointerTriggerAt < 400) return;
          blurActiveElement();
          selectMode(m, 'pad');
        });
      }

      // Mini mode buttons inside Audius & Favorites tabs
      for (const btn of el.miniModeBtns) {
        const modeNum = Number(btn.getAttribute('data-mini-mode'));
        let lastMiniPointer = 0;
        btn.addEventListener('pointerdown', (e) => {
          e.preventDefault();
          blurActiveElement();
          lastMiniPointer = performance.now();
          selectMode(modeNum, 'pad');
        });
        btn.addEventListener('click', () => {
          if (performance.now() - lastMiniPointer < 400) return;
          blurActiveElement();
          selectMode(modeNum, 'pad');
        });
      }

      // Passive user-gesture AudioContext unlock & suspended/interrupted auto-recovery
      const unlockOrRecoverAudio = () => {
        if (!audioCtx || audioCtx.state === 'suspended' || audioCtx.state === 'interrupted') {
          ensureAudioContext();
        }
      };
      window.addEventListener('pointerdown', unlockOrRecoverAudio, { passive: true });
      window.addEventListener('touchend', unlockOrRecoverAudio, { passive: true });
      window.addEventListener('click', unlockOrRecoverAudio, { passive: true });

      const resumeIfVisible = () => {
        if (!document.hidden && audioCtx && (audioCtx.state === 'suspended' || audioCtx.state === 'interrupted')) {
          try {
            const p = audioCtx.resume();
            if (p && typeof p.then === 'function') {
              p.then(() => updateAudioStatusUI()).catch(() => {});
            }
          } catch (_) {}
        }
      };
      document.addEventListener('visibilitychange', resumeIfVisible);
      window.addEventListener('pageshow', resumeIfVisible);
      window.addEventListener('focus', resumeIfVisible);

      // ---------- Bluetooth HID Keyboard Handling ----------
      function mapKeyEventToMode(e) {
        if (e.key === '0' || e.key === '０' || e.code === 'Digit0' || e.code === 'Numpad0') return 0;
        if (e.key === '1' || e.key === '１' || e.code === 'Digit1' || e.code === 'Numpad1') return 1;
        if (e.key === '2' || e.key === '２' || e.code === 'Digit2' || e.code === 'Numpad2') return 2;
        if (e.key === '3' || e.key === '３' || e.code === 'Digit3' || e.code === 'Numpad3') return 3;
        return null;
      }

      function showKeyDebug(e, matchedMode) {
        const keyLabel = e.key === ' ' ? 'Space' : (e.key || '?');
        const codeLabel = e.code ? ` [${e.code}]` : '';
        const statusTag = matchedMode !== null ? ` -> M${matchedMode}` : '';
        el.keyDebugText.textContent = `KEY: ${keyLabel}${codeLabel}${statusTag}`;

        el.keyDebug.classList.remove('flash-mapped', 'flash-unmapped');
        void el.keyDebug.offsetWidth;
        el.keyDebug.classList.add(matchedMode !== null ? 'flash-mapped' : 'flash-unmapped');

        if (keyFlashTimer) clearTimeout(keyFlashTimer);
        keyFlashTimer = setTimeout(() => {
          el.keyDebug.classList.remove('flash-mapped', 'flash-unmapped');
        }, 650);
      }

      window.addEventListener('keydown', (e) => {
        if (e.repeat) return;
        if (e.isComposing === true || e.keyCode === 229) return;
        if (e.ctrlKey || e.metaKey || e.altKey) return;
        if (isEditableElementActive()) return;

        const mappedMode = mapKeyEventToMode(e);
        showKeyDebug(e, mappedMode);

        if (mappedMode !== null) {
          e.preventDefault();
          selectMode(mappedMode, 'hid');
        }
      });

      // Initialize UI, preset chips, favorites, artwork & start render loop
      el.nowPlayingArt.addEventListener('error', () => {
        if (el.nowPlayingArt.src !== PLACEHOLDER_ART_URI) {
          el.nowPlayingArt.src = PLACEHOLDER_ART_URI;
        }
      });
      renderPresetChips();
      updateFavoritesUI();
      updateNowPlayingUI();
      updateUI();
      requestAnimationFrame(renderLoop);
    })();
  </script>
</body>
</html>
