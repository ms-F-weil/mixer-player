<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0b0d11" />
  <title>BT Mixer Pitch Controller</title>
  <style>
    :root {
      --bg-chassis: #0b0d11;
      --bg-panel: #141922;
      --bg-panel-elev: #1b2230;
      --bg-well: #0d1118;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-strong: rgba(255, 255, 255, 0.16);
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;

      --accent-0-stop: #ef4444;
      --accent-0-norm: #38bdf8;
      --accent-1: #22d3ee;
      --accent-2: #f59e0b;
      --accent-3: #f43f5e;
      --accent-ok: #10b981;
      --active-color: var(--accent-0-stop);

      --radius-lg: 14px;
      --radius-md: 10px;
      --radius-sm: 7px;
      --gap: clamp(5px, 1.1dvh, 9px);
      --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Segoe UI", sans-serif;
      --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: var(--bg-chassis);
      color: var(--text-primary);
      font-family: var(--font-sans);
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      overscroll-behavior: none;
    }

    .app-shell {
      height: 100dvh;
      width: 100%;
      max-width: 540px;
      margin: 0 auto;
      padding:
        calc(6px + env(safe-area-inset-top))
        calc(10px + env(safe-area-inset-right))
        calc(6px + env(safe-area-inset-bottom))
        calc(10px + env(safe-area-inset-left));
      display: flex;
      flex-direction: column;
      gap: var(--gap);
      background:
        radial-gradient(circle at 50% -10%, rgba(56, 189, 248, 0.08), transparent 48%),
        linear-gradient(180deg, #0e1219 0%, #090b0f 100%);
    }

    .panel {
      background: linear-gradient(180deg, var(--bg-panel-elev) 0%, var(--bg-panel) 100%);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.05),
        0 6px 18px rgba(0, 0, 0, 0.4);
    }

    /* 1. Top Transport & File Bar */
    .topbar {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 8px;
      min-height: 44px;
      flex-shrink: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 5px;
      padding-right: 4px;
      flex-shrink: 0;
    }

    .status-led {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #475569;
      box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.05);
      transition: background-color 0.2s, box-shadow 0.2s;
    }

    .status-led.running {
      background: var(--accent-ok);
      box-shadow: 0 0 8px rgba(16, 185, 129, 0.85);
    }

    .status-led.playing {
      background: var(--active-color);
      box-shadow: 0 0 10px var(--active-color);
    }

    .brand-title {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.08em;
      color: var(--text-secondary);
      white-space: nowrap;
    }

    .file-input-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .btn {
      appearance: none;
      border: 1px solid var(--border-strong);
      background: linear-gradient(180deg, #252e3f 0%, #1a212e 100%);
      color: var(--text-primary);
      font-family: inherit;
      font-size: 12px;
      font-weight: 700;
      border-radius: var(--radius-sm);
      padding: 6px 9px;
      height: 32px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      transition: transform 0.08s ease, border-color 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
    }

    .btn:active {
      transform: scale(0.96);
    }

    .btn.needs-audio {
      border-color: var(--accent-1);
      box-shadow: 0 0 12px rgba(34, 211, 238, 0.45);
    }

    .btn-demo {
      color: #cbd5e1;
      padding: 6px 8px;
    }

    .btn-demo.active {
      border-color: rgba(56, 189, 248, 0.55);
      color: #7dd3fc;
    }

    .track-pill {
      flex: 1;
      min-width: 0;
      height: 32px;
      background: var(--bg-well);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      padding: 0 8px;
      display: flex;
      align-items: center;
      overflow: hidden;
    }

    .track-name {
      font-size: 11px;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
    }

    .track-name.loaded {
      color: var(--text-primary);
      font-weight: 600;
    }

    .btn-transport {
      width: 38px;
      padding: 0;
      font-size: 14px;
      background: linear-gradient(180deg, #1f332c 0%, #13221d 100%);
      border-color: rgba(16, 185, 129, 0.45);
      color: #6ee7b7;
    }

    .btn-transport.is-playing {
      background: linear-gradient(180deg, #3b1d24 0%, #241116 100%);
      border-color: rgba(244, 63, 94, 0.55);
      color: #fda4af;
    }

    /* 2. Meter & Options Deck */
    .deck {
      display: grid;
      grid-template-columns: minmax(106px, 122px) 1fr;
      gap: 10px;
      padding: clamp(7px, 1.3dvh, 11px) 10px;
      align-items: center;
      flex-shrink: 0;
    }

    .rotor-box {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      max-width: 118px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .rotor-svg {
      width: 100%;
      height: 100%;
      display: block;
      overflow: visible;
    }

    .deck-info {
      display: flex;
      flex-direction: column;
      gap: clamp(4px, 0.8dvh, 7px);
      min-width: 0;
    }

    .readout-row {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 6px;
    }

    .rate-main {
      display: flex;
      align-items: baseline;
      gap: 2px;
      line-height: 1;
    }

    .rate-value {
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
      font-size: clamp(28px, 5.2dvh, 36px);
      font-weight: 800;
      letter-spacing: -0.03em;
      color: var(--text-primary);
      text-shadow: 0 0 18px color-mix(in srgb, var(--active-color) 40%, transparent);
    }

    .rate-unit {
      font-family: var(--font-mono);
      font-size: 14px;
      font-weight: 700;
      color: var(--text-secondary);
    }

    .mode-meta {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 2px;
      min-width: 0;
    }

    .mode-badge {
      font-size: 11px;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 999px;
      border: 1px solid color-mix(in srgb, var(--active-color) 55%, transparent);
      background: color-mix(in srgb, var(--active-color) 16%, #0b0d11);
      color: var(--text-primary);
      white-space: nowrap;
    }

    .target-sub {
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
      font-size: 10px;
      color: var(--text-secondary);
      white-space: nowrap;
    }

    .progress-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .progress-track {
      flex: 1;
      height: 5px;
      background: var(--bg-well);
      border-radius: 999px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent-1), var(--active-color));
      border-radius: 999px;
      transition: background 0.2s ease;
    }

    .time-readout {
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
      font-size: 10px;
      color: var(--text-secondary);
      white-space: nowrap;
    }

    .toggles-row {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 6px;
    }

    .pill-toggle {
      appearance: none;
      border: 1px solid var(--border-strong);
      background: var(--bg-well);
      color: var(--text-secondary);
      font-family: inherit;
      font-size: 11px;
      font-weight: 700;
      border-radius: var(--radius-sm);
      padding: 5px 8px;
      height: 28px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: border-color 0.15s, color 0.15s, background-color 0.15s;
    }

    .pill-toggle:active {
      transform: scale(0.97);
    }

    .pill-toggle.is-on {
      border-color: rgba(34, 211, 238, 0.55);
      background: rgba(34, 211, 238, 0.12);
      color: #67e8f9;
    }

    .pill-toggle.zero-normal {
      border-color: rgba(56, 189, 248, 0.55);
      background: rgba(56, 189, 248, 0.12);
      color: #7dd3fc;
    }

    .pill-toggle.zero-stop {
      border-color: rgba(239, 68, 68, 0.45);
      background: rgba(239, 68, 68, 0.1);
      color: #fca5a5;
    }

    /* 3. 2x2 Large Hardware Mode Pads */
    .pads-grid {
      flex: 1;
      min-height: 132px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: var(--gap);
    }

    .mode-pad {
      --pad-color: var(--accent-0-stop);
      position: relative;
      appearance: none;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-lg);
      background: linear-gradient(180deg, #1d2432 0%, #121721 100%);
      color: var(--text-primary);
      padding: clamp(8px, 1.4dvh, 14px) 12px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: stretch;
      text-align: left;
      cursor: pointer;
      overflow: hidden;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.06),
        0 4px 12px rgba(0, 0, 0, 0.35);
      transition: transform 0.08s ease, border-color 0.16s ease, box-shadow 0.16s ease, background 0.16s ease;
    }

    .mode-pad:active {
      transform: scale(0.975);
    }

    .mode-pad[data-mode="0"] { --pad-color: var(--accent-0-stop); }
    .mode-pad[data-mode="0"].is-normal-zero { --pad-color: var(--accent-0-norm); }
    .mode-pad[data-mode="1"] { --pad-color: var(--accent-1); }
    .mode-pad[data-mode="2"] { --pad-color: var(--accent-2); }
    .mode-pad[data-mode="3"] { --pad-color: var(--accent-3); }

    .pad-led-bar {
      position: absolute;
      top: 0;
      left: 12px;
      right: 12px;
      height: 3px;
      border-radius: 0 0 4px 4px;
      background: color-mix(in srgb, var(--pad-color) 35%, #263042);
      transition: background-color 0.15s ease, box-shadow 0.15s ease;
    }

    .pad-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
    }

    .pad-key {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 5px;
      background: rgba(0, 0, 0, 0.42);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: var(--text-secondary);
    }

    .pad-rate {
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
      font-size: clamp(12px, 2dvh, 14px);
      font-weight: 700;
      color: var(--text-secondary);
    }

    .pad-center {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 6px;
      width: 100%;
    }

    .pad-label-ja {
      font-size: clamp(19px, 3.2dvh, 24px);
      font-weight: 900;
      letter-spacing: 0.02em;
      line-height: 1.1;
    }

    .pad-label-en {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.09em;
      color: var(--text-muted);
    }

    .mode-pad.is-active {
      border-color: var(--pad-color);
      background: linear-gradient(
        180deg,
        color-mix(in srgb, var(--pad-color) 20%, #1b2230) 0%,
        color-mix(in srgb, var(--pad-color) 9%, #111620) 100%
      );
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.15),
        0 0 18px color-mix(in srgb, var(--pad-color) 32%, transparent);
    }

    .mode-pad.is-active .pad-led-bar {
      background: var(--pad-color);
      box-shadow: 0 0 12px var(--pad-color);
    }

    .mode-pad.is-active .pad-key {
      border-color: color-mix(in srgb, var(--pad-color) 65%, transparent);
      color: var(--text-primary);
      background: color-mix(in srgb, var(--pad-color) 26%, #0b0d11);
    }

    .mode-pad.is-active .pad-rate,
    .mode-pad.is-active .pad-label-en {
      color: var(--text-primary);
    }

    .mode-pad[data-mode="3"].is-active {
      animation: flashPulse 1.1s ease-in-out infinite;
    }

    @keyframes flashPulse {
      0%, 100% {
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.18),
          0 0 16px rgba(244, 63, 94, 0.35);
      }
      50% {
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.28),
          0 0 26px rgba(244, 63, 94, 0.68);
      }
    }

    /* 4. Real-Time Sliders Panel */
    .tuning-panel {
      padding: clamp(6px, 1.1dvh, 10px) 10px;
      display: flex;
      flex-direction: column;
      gap: clamp(4px, 0.8dvh, 7px);
      flex-shrink: 0;
    }

    .tuning-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .tuning-title {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.12em;
      color: var(--text-secondary);
    }

    .btn-reset {
      appearance: none;
      border: 1px solid var(--border-subtle);
      background: var(--bg-well);
      color: var(--text-secondary);
      font-family: inherit;
      font-size: 10px;
      font-weight: 700;
      border-radius: 5px;
      padding: 2px 7px;
      cursor: pointer;
    }

    .btn-reset:active {
      transform: scale(0.95);
    }

    .slider-row {
      display: grid;
      grid-template-columns: 78px 1fr 48px;
      align-items: center;
      gap: 8px;
      height: clamp(23px, 3.6dvh, 28px);
    }

    .slider-label {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .dot-1 { background: var(--accent-1); }
    .dot-2 { background: var(--accent-2); }
    .dot-3 { background: var(--accent-3); }
    .dot-tau { background: #a78bfa; }

    .slider {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 24px;
      background: transparent;
      margin: 0;
      touch-action: pan-x;
      cursor: pointer;
    }

    .slider:focus {
      outline: none;
    }

    .slider::-webkit-slider-runnable-track {
      height: 6px;
      border-radius: 999px;
      background: #0a0d13;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: linear-gradient(180deg, #f8fafc 0%, #cbd5e1 100%);
      border: 2px solid #0f172a;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.55);
      margin-top: -8px;
    }

    .slider::-moz-range-track {
      height: 6px;
      border-radius: 999px;
      background: #0a0d13;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .slider::-moz-range-thumb {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #f1f5f9;
      border: 2px solid #0f172a;
    }

    .slider-val {
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
      font-size: 11px;
      font-weight: 700;
      text-align: right;
      color: var(--text-primary);
    }

    /* Bottom Micro-Status Bar & Corner Key Debug */
    .footer-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 0 3px;
      min-height: 22px;
      flex-shrink: 0;
    }

    .audio-status {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .audio-status.ok {
      color: #6ee7b7;
    }

    .audio-status.warn {
      color: #fbbf24;
    }

    .audio-status.err {
      color: #fca5a5;
    }

    .key-debug {
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 5px;
      background: #121720;
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      display: inline-flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
      flex-shrink: 0;
      transition: border-color 0.12s, background-color 0.12s, color 0.12s;
    }

    .key-debug-led {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #475569;
    }

    .key-debug.flash-mapped {
      border-color: var(--accent-ok);
      background: rgba(16, 185, 129, 0.16);
      color: #a7f3d0;
    }

    .key-debug.flash-mapped .key-debug-led {
      background: var(--accent-ok);
      box-shadow: 0 0 8px var(--accent-ok);
    }

    .key-debug.flash-unmapped {
      border-color: var(--accent-2);
      background: rgba(245, 158, 11, 0.16);
      color: #fde68a;
    }

    .key-debug.flash-unmapped .key-debug-led {
      background: var(--accent-2);
      box-shadow: 0 0 8px var(--accent-2);
    }

    @media (max-height: 480px) {
      html, body {
        overflow-y: auto;
      }
      .app-shell {
        height: auto;
        min-height: 100dvh;
      }
      .pads-grid {
        min-height: 140px;
      }
    }
  </style>
</head>
<body>
  <main class="app-shell">
    <!-- 1. Top Transport & File Bar -->
    <header class="panel topbar">
      <div class="brand">
        <span class="status-led" id="statusLed" aria-hidden="true"></span>
        <span class="brand-title">BT MIXER</span>
      </div>

      <input
        type="file"
        id="fileInput"
        class="file-input-hidden"
        accept="audio/*,audio/mpeg,audio/wav,audio/x-wav,audio/mp4,audio/x-m4a,.mp3,.wav,.m4a,.aac,.ogg,.flac"
      />
      <label for="fileInput" id="fileLabel" class="btn" title="音声ファイルを選択">📂 音源</label>

      <button type="button" id="demoBtn" class="btn btn-demo" title="内蔵デモ音源をロード">♪ デモ</button>

      <div class="track-pill" title="読み込み中の音源">
        <span id="trackName" class="track-name">音源未選択</span>
      </div>

      <button type="button" id="playStopBtn" class="btn btn-transport" aria-label="再生または停止">▶</button>
    </header>

    <!-- 2. Meter & Options Deck -->
    <section class="panel deck" aria-label="メーターと設定">
      <div class="rotor-box">
        <svg class="rotor-svg" viewBox="0 0 120 120" aria-hidden="true">
          <defs>
            <radialGradient id="platterGrad" cx="50%" cy="45%" r="55%">
              <stop offset="0%" stop-color="#283244" />
              <stop offset="65%" stop-color="#141923" />
              <stop offset="100%" stop-color="#0b0e14" />
            </radialGradient>
          </defs>

          <!-- Level meter outer ring -->
          <circle cx="60" cy="60" r="55" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="3" />
          <circle
            id="audioRing"
            cx="60"
            cy="60"
            r="55"
            fill="none"
            stroke="#22d3ee"
            stroke-width="3"
            stroke-linecap="round"
            stroke-dasharray="345.6"
            stroke-dashoffset="345.6"
            transform="rotate(-90 60 60)"
            opacity="0.7"
          />

          <!-- Tachometer track (270 deg arc from 135 deg to 405 deg, r=46) -->
          <path
            d="M 27.5 92.5 A 46 46 0 1 1 92.5 92.5"

  <script>
    (() => {
      'use strict';

      // Configure iOS 17+ AudioSession so Web Audio plays with silent switch ON and routes cleanly to BT speakers.
      if ('audioSession' in navigator) {
        try {
          navigator.audioSession.type = 'playback';
        } catch (_) {}
      }

      const STORAGE_KEY = 'bt_mixer_pitch_settings_v1';
      const DEFAULTS = {
        rates: { 1: 1.00, 2: 1.40, 3: 2.00 },
        inertiaTau: 0.25,
        isLooping: true,
        zeroBehavior: 'stop' // 'stop' | 'normal'
      };

      const MODE_META = {
        0: { ja: '切', en: 'OFF' },
        1: { ja: '弱', en: 'LOW' },
        2: { ja: '強', en: 'HIGH' },
        3: { ja: 'フラッシュ', en: 'FLASH' }
      };

      const MIN_RATE = 0.001;
      const FADE_START_RATE = 0.10;
      const STOP_THRESHOLD_RATE = 0.025;
      const TACHO_MAX_RATE = 3.0;
      const TACHO_ARC_LEN = 216.8;
      const RING_LEN = 345.6;

      // App state
      let settings = loadSettings();
      let activeMode = 0;
      let playbackState = 'stopped'; // 'stopped' | 'playing' | 'stopping'

      // Audio graph state
      let audioCtx = null;
      let motorGain = null;
      let analyser = null;
      let masterGain = null;
      let analyserData = null;
      let isAudioUnlocked = false;
      let audioBuffer = null;
      let isDemoLoaded = false;
      let currentSource = null;
      let stopTimerId = null;

      // Exact dual-locked exponential playbackRate model
      let rateStartVal = 0;
      let rateTargetVal = 0;
      let rateStartTime = 0;
      let rateTau = settings.inertiaTau;
      let anchorBufferOffset = 0;

      // Exact piecewise gain envelope model for click-free spin-down & recovery
      // Each segment: { type: 'const'|'linear'|'exp', t0, v0, t1?, v1?, target?, tau? }
      let gainSegments = [{ type: 'const', t0: 0, v0: 0 }];

      // Visual animation state
      let rotorAngle = 0;
      let lastFramePerf = performance.now();
      let statusOverride = null;
      let statusOverrideTimer = null;
      let keyFlashTimer = null;

      // DOM refs
      const el = {
        statusLed: document.getElementById('statusLed'),
        fileInput: document.getElementById('fileInput'),
        fileLabel: document.getElementById('fileLabel'),
        demoBtn: document.getElementById('demoBtn'),
        trackName: document.getElementById('trackName'),
        playStopBtn: document.getElementById('playStopBtn'),
        tachoArc: document.getElementById('tachoArc'),
        audioRing: document.getElementById('audioRing'),
        rotorGroup: document.getElementById('rotorGroup'),
        needleGroup: document.getElementById('needleGroup'),
        liveRateText: document.getElementById('liveRateText'),
        activeModeBadge: document.getElementById('activeModeBadge'),
        targetRateText: document.getElementById('targetRateText'),
        progressFill: document.getElementById('progressFill'),
        timeReadout: document.getElementById('timeReadout'),
        loopToggleBtn: document.getElementById('loopToggleBtn'),
        zeroModeToggleBtn: document.getElementById('zeroModeToggleBtn'),
        pads: [
          document.getElementById('pad0'),
          document.getElementById('pad1'),
          document.getElementById('pad2'),
          document.getElementById('pad3')
        ],
        padRates: {
          0: document.getElementById('padRate0'),
          1: document.getElementById('padRate1'),
          2: document.getElementById('padRate2'),
          3: document.getElementById('padRate3')
        },
        slider1: document.getElementById('slider1'),
        slider2: document.getElementById('slider2'),
        slider3: document.getElementById('slider3'),
        sliderTau: document.getElementById('sliderTau'),
        val1: document.getElementById('val1'),
        val2: document.getElementById('val2'),
        val3: document.getElementById('val3'),
        valTau: document.getElementById('valTau'),
        resetBtn: document.getElementById('resetBtn'),
        audioStatusText: document.getElementById('audioStatusText'),
        keyDebug: document.getElementById('keyDebug'),
        keyDebugText: document.getElementById('keyDebugText')
      };

      // ---------- Settings Persistence ----------
      function cloneDefaults() {
        return {
          rates: { ...DEFAULTS.rates },
          inertiaTau: DEFAULTS.inertiaTau,
          isLooping: DEFAULTS.isLooping,
          zeroBehavior: DEFAULTS.zeroBehavior
        };
      }

      function clamp(val, min, max) {
        return Math.min(max, Math.max(min, val));
      }

      function loadSettings() {
        const base = cloneDefaults();
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return base;
          const parsed = JSON.parse(raw);
          if (parsed && typeof parsed === 'object') {
            if (parsed.rates) {
              for (const k of [1, 2, 3]) {
                const v = Number(parsed.rates[k]);
                if (Number.isFinite(v)) base.rates[k] = clamp(v, 0.25, 3.0);
              }
            }
            const tau = Number(parsed.inertiaTau);
            if (Number.isFinite(tau)) base.inertiaTau = clamp(tau, 0.02, 1.5);
            if (typeof parsed.isLooping === 'boolean') base.isLooping = parsed.isLooping;
            if (parsed.zeroBehavior === 'stop' || parsed.zeroBehavior === 'normal') {
              base.zeroBehavior = parsed.zeroBehavior;
            }
          }
        } catch (_) {}
        return base;
      }

      function saveSettings() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(settings));
        } catch (_) {}
      }

      // ---------- Exponential Rate & Integral Math ----------
      function evalExponentialRate(startVal, targetVal, dt, tau) {
        const safeTau = Math.max(0.0001, tau);
        const safeDt = Math.max(0, dt);
        return targetVal + (startVal - targetVal) * Math.exp(-safeDt / safeTau);
      }

      function integrateExponentialRate(startVal, targetVal, dt, tau) {
        const safeTau = Math.max(0.0001, tau);
        const safeDt = Math.max(0, dt);
        return targetVal * safeDt + (startVal - targetVal) * safeTau * (1 - Math.exp(-safeDt / safeTau));
      }

      function normalizeBufferOffset(offset, duration, looping) {
        if (!Number.isFinite(duration) || duration <= 0) return 0;
        if (looping) {
          const mod = offset % duration;
          return mod < 0 ? mod + duration : mod;
        }
        return clamp(offset, 0, duration);
      }

      function getCurrentRate(now) {
        if (playbackState === 'stopped') return 0;
        return evalExponentialRate(rateStartVal, rateTargetVal, now - rateStartTime, rateTau);
      }

      function getLiveBufferOffset(now) {
        if (!audioBuffer) return 0;
        if (playbackState === 'stopped') {
          return normalizeBufferOffset(anchorBufferOffset, audioBuffer.duration, settings.isLooping);
        }
        const delta = integrateExponentialRate(rateStartVal, rateTargetVal, now - rateStartTime, rateTau);
        return normalizeBufferOffset(anchorBufferOffset + delta, audioBuffer.duration, settings.isLooping);
      }

      function commitRateAnchor(now, newTarget, newTau) {
        const curRate = getCurrentRate(now);
        if (audioBuffer) {
          anchorBufferOffset = getLiveBufferOffset(now);
        }
        rateStartVal = curRate;
        rateTargetVal = newTarget;
        rateStartTime = now;
        rateTau = Math.max(0.005, newTau);
        return curRate;
      }

      function computeSpinDownTimes(currentRate, now, tau) {
        const safeTau = Math.max(0.005, tau);
        const safeCur = Math.max(MIN_RATE, currentRate);

        let dtFade = 0;
        if (safeCur > FADE_START_RATE) {
          dtFade = -safeTau * Math.log((FADE_START_RATE - MIN_RATE) / (safeCur - MIN_RATE));
        }

        let dtStop = 0;
        if (safeCur > STOP_THRESHOLD_RATE) {
          dtStop = -safeTau * Math.log((STOP_THRESHOLD_RATE - MIN_RATE) / (safeCur - MIN_RATE));
        }

        const tFade = now + Math.max(0, dtFade);
        const tStop = Math.max(tFade + 0.04, now + Math.max(0, dtStop));
        return { tFade, tStop };
      }

      // ---------- Piecewise Motor Gain Model ----------
      function getCurrentMotorGain(now) {
        if (!gainSegments || gainSegments.length === 0) return 1;
        let seg = gainSegments[gainSegments.length - 1];
        for (let i = 0; i < gainSegments.length; i++) {
          const s = gainSegments[i];
          const nextT = i + 1 < gainSegments.length ? gainSegments[i + 1].t0 : Infinity;
          if (now >= s.t0 && now < nextT) {
            seg = s;
            break;
          }
        }
        if (seg.type === 'const') return seg.v0;
        if (seg.type === 'linear') {
          if (now <= seg.t0) return seg.v0;
          if (now >= seg.t1) return seg.v1;
          const span = Math.max(0.0001, seg.t1 - seg.t0);
          return seg.v0 + (seg.v1 - seg.v0) * ((now - seg.t0) / span);
        }
        if (seg.type === 'exp') {
          return evalExponentialRate(seg.v0, seg.target, now - seg.t0, seg.tau);
        }
        return 1;
      }

      function setMotorGainTarget(now, target, tau) {
        const cur = getCurrentMotorGain(now);
        const safeTau = Math.max(0.005, tau);
        if (motorGain) {
          motorGain.gain.cancelScheduledValues(now);
          motorGain.gain.setValueAtTime(cur, now);
          motorGain.gain.setTargetAtTime(target, now, safeTau);
        }
        gainSegments = [{ type: 'exp', t0: now, v0: cur, target, tau: safeTau }];
      }

      function scheduleMotorSpinDownGain(now, tFade, tStop) {
        const cur = getCurrentMotorGain(now);
        const segs = [];
        if (motorGain) {
          motorGain.gain.cancelScheduledValues(now);
          motorGain.gain.setValueAtTime(cur, now);
        }

        if (tFade > now + 0.005) {
          if (cur < 0.999) {
            const tUp = Math.min(tFade, now + 0.03);
            if (motorGain) motorGain.gain.linearRampToValueAtTime(1.0, tUp);
            segs.push({ type: 'linear', t0: now, v0: cur, t1: tUp, v1: 1.0 });
            if (tFade > tUp) {
              if (motorGain) motorGain.gain.setValueAtTime(1.0, tFade);
              segs.push({ type: 'const', t0: tUp, v0: 1.0 });
            }
          } else {
            if (motorGain) motorGain.gain.setValueAtTime(1.0, tFade);
            segs.push({ type: 'const', t0: now, v0: 1.0 });
          }
          if (motorGain) motorGain.gain.linearRampToValueAtTime(0.0, tStop);
          segs.push({ type: 'linear', t0: tFade, v0: 1.0, t1: tStop, v1: 0.0 });
          segs.push({ type: 'const', t0: tStop, v0: 0.0 });
        } else {
          if (motorGain) motorGain.gain.linearRampToValueAtTime(0.0, tStop);
          segs.push({ type: 'linear', t0: now, v0: cur, t1: tStop, v1: 0.0 });
          segs.push({ type: 'const', t0: tStop, v0: 0.0 });
        }
        gainSegments = segs;
      }

      // ---------- Web Audio Initialization & Unlock ----------
      function ensureAudioContext() {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) {
          setStatusOverride('Web Audio非対応ブラウザです', 'err', 4000);
          return null;
        }

        if (!audioCtx) {
          audioCtx = new AudioCtx();
          motorGain = audioCtx.createGain();
          motorGain.gain.value = 0;

          analyser = audioCtx.createAnalyser();
          analyser.fftSize = 256;
          analyser.smoothingTimeConstant = 0.78;
          analyserData = new Uint8Array(analyser.frequencyBinCount);

          masterGain = audioCtx.createGain();
          masterGain.gain.value = 0.95;

          motorGain.connect(analyser);
          analyser.connect(masterGain);
          masterGain.connect(audioCtx.destination);

          audioCtx.addEventListener('statechange', updateAudioStatusUI);
        }

        if (audioCtx.state !== 'running') {
          try {
            const res = audioCtx.resume();
            if (res && typeof res.then === 'function') {
              res.then(() => updateAudioStatusUI()).catch(() => {});
            }
          } catch (_) {}
        }

        if (!isAudioUnlocked) {
          try {
            const silent = audioCtx.createBuffer(1, 1, audioCtx.sampleRate);
            const src = audioCtx.createBufferSource();
            src.buffer = silent;
            src.connect(audioCtx.destination);
            src.start(0);
            isAudioUnlocked = true;
          } catch (_) {}
        }

        updateAudioStatusUI();
        return audioCtx;
      }

      function decodeAudioDataSafe(ctx, arrayBuffer) {
        return new Promise((resolve, reject) => {
          try {
            const maybePromise = ctx.decodeAudioData(
              arrayBuffer,
              (decoded) => resolve(decoded),
              (err) => reject(err || new Error('音声データのデコードに失敗しました'))
            );
            if (maybePromise && typeof maybePromise.then === 'function') {
              maybePromise.then(resolve, reject);
            }
          } catch (err) {
            reject(err);
          }
        });
      }

      // ---------- Built-in Demo Groove Synthesizer ----------
      function createDemoBuffer(ctx) {
        const sr = ctx.sampleRate || 44100;
        const duration = 4.0; // 120 BPM, 2 bars (8 beats)
        const length = Math.floor(sr * duration);
        const buf = ctx.createBuffer(2, length, sr);
        const left = buf.getChannelData(0);
        const right = buf.getChannelData(1);

        const beatDur = 0.5;
        const eighthDur = 0.25;
        const bassFreqs = [55.0, 55.0, 110.0, 65.41, 73.42, 73.42, 146.83, 82.41];
        const chordRoots = [220.0, 220.0, 261.63, 293.66];

        // Deterministic PRNG for hi-hat texture so demo is reproducible
        let noiseSeed = 1337;
        const nextNoise = () => {
          noiseSeed = (noiseSeed * 1664525 + 1013904223) >>> 0;
          return (noiseSeed / 4294967296) * 2 - 1;
        };

        for (let i = 0; i < length; i++) {
          const t = i / sr;
          const beatIdx = Math.floor(t / beatDur);
          const beatLocal = t - beatIdx * beatDur;
          const eighthIdx = Math.floor(t / eighthDur);
          const eighthLocal = t - eighthIdx * eighthDur;
          const barBeat = beatIdx % 4;

          // Punchy kick on every beat
          const kickFreq = 46 + 115 * Math.exp(-beatLocal * 28);
          const kickEnv = Math.exp(-beatLocal * 11);
          const kick = Math.sin(2 * Math.PI * kickFreq * beatLocal) * kickEnv * 0.55;

          // Off-beat crisp hi-hat
          const isOffHat = eighthIdx % 2 === 1;
          const hatEnv = isOffHat ? Math.exp(-eighthLocal * 38) : Math.exp(-eighthLocal * 65) * 0.25;
          const hatRaw = nextNoise();
          const hat = hatRaw * hatEnv * 0.16;

          // Octave synth bass on 8th notes
          const bassF = bassFreqs[eighthIdx % bassFreqs.length];
          const bassEnv = Math.exp(-eighthLocal * 7.5);
          const bassWave =
            Math.sin(2 * Math.PI * bassF * t) * 0.65 +
            Math.sin(4 * Math.PI * bassF * t) * 0.22 +
            Math.sin(6 * Math.PI * bassF * t) * 0.10;
          const bass = bassWave * bassEnv * 0.34;

          // Melodic chord stab (minor 7th feel) so pitch bend is crystal clear
          const root = chordRoots[Math.floor(beatIdx / 2) % chordRoots.length];
          const stabLocal = beatLocal;
          const stabEnv = (barBeat === 0 || barBeat === 2 ? 0.24 : 0.14) * Math.exp(-stabLocal * 4.5);
          const chordL =
            Math.sin(2 * Math.PI * root * t) +
            0.7 * Math.sin(2 * Math.PI * (root * 1.1892) * t) +
            0.6 * Math.sin(2 * Math.PI * (root * 1.4983) * t);
          const chordR =
            Math.sin(2 * Math.PI * root * t + 0.35) +
            0.7 * Math.sin(2 * Math.PI * (root * 1.1892) * t + 0.55) +
            0.6 * Math.sin(2 * Math.PI * (root * 1.4983) * t + 0.75);

          // Soft seam fade (3ms) at loop boundaries for clickless looping
          let seam = 1;
          const fadeSamples = Math.floor(sr * 0.003);
          if (i < fadeSamples) seam = i / fadeSamples;
          else if (i > length - fadeSamples) seam = (length - i) / fadeSamples;

          left[i] = clamp((kick + bass + chordL * stabEnv + hat * 0.85) * seam, -0.95, 0.95);
          right[i] = clamp((kick + bass + chordR * stabEnv + hat * 1.1) * seam, -0.95, 0.95);
        }

        return buf;
      }

      // ---------- Playback & Motor Control ----------
      function clearStopTimer() {
        if (stopTimerId !== null) {
          clearTimeout(stopTimerId);
          stopTimerId = null;
        }
      }

      function getTargetRateForMode(mode) {
        if (mode === 0) {
          return settings.zeroBehavior === 'normal' ? 1.0 : MIN_RATE;
        }
        return settings.rates[mode] || 1.0;
      }

      function detachSource(source) {
        if (!source) return;
        source.onended = null;
        try {
          source.stop(0);
        } catch (_) {}
        try {
          source.disconnect();
        } catch (_) {}
      }

      function finalizeSpinDownStop(expectedSource) {
        stopTimerId = null;
        if (expectedSource && expectedSource !== currentSource) return;

        const now = audioCtx ? audioCtx.currentTime : 0;
        if (audioBuffer) {
          anchorBufferOffset = getLiveBufferOffset(now);
        }
        detachSource(currentSource);
        currentSource = null;
        playbackState = 'stopped';
        rateStartVal = 0;
        rateTargetVal = 0;
        rateStartTime = now;
        if (motorGain && audioCtx) {
          motorGain.gain.cancelScheduledValues(now);
          motorGain.gain.setValueAtTime(0, now);
          gainSegments = [{ type: 'const', t0: now, v0: 0 }];
        }
        updateUI();
      }

      function immediateStop(resetOffset = false) {
        clearStopTimer();
        const now = audioCtx ? audioCtx.currentTime : 0;
        if (audioBuffer && playbackState !== 'stopped' && !resetOffset) {
          anchorBufferOffset = getLiveBufferOffset(now);
        }
        if (resetOffset) {
          anchorBufferOffset = 0;
        }
        if (currentSource) {
          const old = currentSource;
          currentSource = null;
          detachSource(old);
        }
        playbackState = 'stopped';
        rateStartVal = 0;
        rateTargetVal = 0;
        rateStartTime = now;
        if (motorGain && audioCtx) {
          motorGain.gain.cancelScheduledValues(now);
          motorGain.gain.setValueAtTime(0, now);
          gainSegments = [{ type: 'const', t0: now, v0: 0 }];
        }
        updateUI();
      }

      function rampPlaybackRate(newTarget, tau) {
        if (!audioCtx || !currentSource) return;
        const now = audioCtx.currentTime;
        const safeTarget = Math.max(MIN_RATE, newTarget);
        const safeTau = Math.max(0.005, tau);

        const current = Math.max(MIN_RATE, commitRateAnchor(now, safeTarget, safeTau));
        currentSource.playbackRate.cancelScheduledValues(now);
        currentSource.playbackRate.setValueAtTime(current, now);
        currentSource.playbackRate.setTargetAtTime(safeTarget, now, safeTau);
      }

      function startPlaybackFromStandstill(targetRate) {
        const ctx = ensureAudioContext();
        if (!ctx || !audioBuffer) return;

        clearStopTimer();
        if (currentSource) {
          detachSource(currentSource);
          currentSource = null;
        }

        const now = ctx.currentTime;
        const safeTarget = Math.max(MIN_RATE, targetRate);
        const safeTau = Math.max(0.005, settings.inertiaTau);
        const initialSpinRate = Math.min(0.08, safeTarget);

        if (!settings.isLooping && anchorBufferOffset >= audioBuffer.duration - 0.02) {
          anchorBufferOffset = 0;
        }
        const startOffset = normalizeBufferOffset(anchorBufferOffset, audioBuffer.duration, settings.isLooping);
        anchorBufferOffset = startOffset;

        const src = ctx.createBufferSource();
        src.buffer = audioBuffer;
        src.loop = settings.isLooping;
        src.playbackRate.setValueAtTime(initialSpinRate, now);
        src.playbackRate.setTargetAtTime(safeTarget, now, safeTau);
        src.connect(motorGain);

        src.onended = () => {
          if (src !== currentSource) return;
          currentSource = null;
          clearStopTimer();
          playbackState = 'stopped';
          anchorBufferOffset = 0;
          const endNow = audioCtx ? audioCtx.currentTime : 0;
          rateStartVal = 0;
          rateTargetVal = 0;
          rateStartTime = endNow;
          if (motorGain && audioCtx) {
            motorGain.gain.cancelScheduledValues(endNow);
            motorGain.gain.setValueAtTime(0, endNow);
            gainSegments = [{ type: 'const', t0: endNow, v0: 0 }];
          }
          updateUI();
        };

        currentSource = src;
        playbackState = 'playing';
        rateStartVal = initialSpinRate;
        rateTargetVal = safeTarget;
        rateStartTime = now;
        rateTau = safeTau;

        // Smooth 40ms click-free fade-in
        motorGain.gain.cancelScheduledValues(now);
        motorGain.gain.setValueAtTime(0, now);
        motorGain.gain.linearRampToValueAtTime(1.0, now + 0.04);
        gainSegments = [
          { type: 'linear', t0: now, v0: 0, t1: now + 0.04, v1: 1.0 },
          { type: 'const', t0: now + 0.04, v0: 1.0 }
        ];

        src.start(now, startOffset);
        updateUI();
      }

      function triggerSpinDownStop() {
        if (!audioCtx || !currentSource || playbackState === 'stopped') {
          playbackState = 'stopped';
          updateUI();
          return;
        }
        clearStopTimer();
        const now = audioCtx.currentTime;
        const safeTau = Math.max(0.005, settings.inertiaTau);
        const curRate = Math.max(MIN_RATE, commitRateAnchor(now, MIN_RATE, safeTau));

        currentSource.playbackRate.cancelScheduledValues(now);
        currentSource.playbackRate.setValueAtTime(curRate, now);
        currentSource.playbackRate.setTargetAtTime(MIN_RATE, now, safeTau);

        const { tFade, tStop } = computeSpinDownTimes(curRate, now, safeTau);
        scheduleMotorSpinDownGain(now, tFade, tStop);

        playbackState = 'stopping';
        const srcRef = currentSource;
        const delayMs = Math.max(60, (tStop - now) * 1000 + 30);
        stopTimerId = setTimeout(() => finalizeSpinDownStop(srcRef), delayMs);
        updateUI();
      }

      function selectMode(mode, sourceTag) {
        ensureAudioContext();
        activeMode = mode;

        if (!audioBuffer) {
          updateUI();
          if (mode !== 0 && sourceTag === 'pad') {
            pulseAudioButtons();
            setStatusOverride('「音源」または「デモ」を選んでください', 'warn', 2600);
          }
          return;
        }

        const isStopZero = mode === 0 && settings.zeroBehavior === 'stop';
        if (isStopZero) {
          if (playbackState === 'playing') {
            triggerSpinDownStop();
          } else {
            updateUI();
          }
          return;
        }

        const targetRate = getTargetRateForMode(mode);
        if (playbackState === 'stopped') {
          startPlaybackFromStandstill(targetRate);
        } else {
          // Recover smoothly whether currently 'playing' or mid-'stopping'
          clearStopTimer();
          playbackState = 'playing';
          const now = audioCtx.currentTime;
          setMotorGainTarget(now, 1.0, 0.025);
          rampPlaybackRate(targetRate, settings.inertiaTau);
          updateUI();
        }
      }

      function toggleMasterPlayStop() {
        ensureAudioContext();
        if (!audioBuffer) {
          pulseAudioButtons();
          setStatusOverride('先に「音源」または「デモ」を読み込んでください', 'warn', 2800);
          return;
        }

        if (playbackState === 'playing') {
          // Quick 40ms fade-out and stop cleanly
          clearStopTimer();
          const now = audioCtx.currentTime;
          const curGain = getCurrentMotorGain(now);
          motorGain.gain.cancelScheduledValues(now);
          motorGain.gain.setValueAtTime(curGain, now);
          motorGain.gain.linearRampToValueAtTime(0, now + 0.04);
          gainSegments = [
            { type: 'linear', t0: now, v0: curGain, t1: now + 0.04, v1: 0 },
            { type: 'const', t0: now + 0.04, v0: 0 }
          ];
          playbackState = 'stopping';
          const srcRef = currentSource;
          stopTimerId = setTimeout(() => finalizeSpinDownStop(srcRef), 55);
          updateUI();
          return;
        }

        // Stopped or mid-spin-down -> start or resume
        if (activeMode === 0 && settings.zeroBehavior === 'stop') {
          activeMode = 1;
        }
        const targetRate = getTargetRateForMode(activeMode);
        if (playbackState === 'stopping' && currentSource) {
          clearStopTimer();
          playbackState = 'playing';
          setMotorGainTarget(audioCtx.currentTime, 1.0, 0.025);
          rampPlaybackRate(targetRate, settings.inertiaTau);
          updateUI();
        } else {
          startPlaybackFromStandstill(targetRate);
        }
      }

      // ---------- File Loading & Demo Loading ----------
      async function handleFileSelection(file) {
        if (!file) return;
        const ctx = ensureAudioContext();
        if (!ctx) return;

        el.trackName.textContent = `読込中: ${file.name}`;
        el.trackName.classList.remove('loaded');
        setStatusOverride('音声をデコード中...', 'warn', 10000);

        try {
          const arrayBuf = await readFileAsArrayBuffer(file);
          const decoded = await decodeAudioDataSafe(ctx, arrayBuf);

          immediateStop(true);
          audioBuffer = decoded;
          isDemoLoaded = false;
          el.demoBtn.classList.remove('active');
          el.trackName.textContent = file.name;
          el.trackName.classList.add('loaded');
          setStatusOverride(`読込完了 (${formatTime(decoded.duration)})`, 'ok', 2500);

          // If user already chose an active speed mode (1..3 or normal 0), start playing immediately
          if (!(activeMode === 0 && settings.zeroBehavior === 'stop')) {
            startPlaybackFromStandstill(getTargetRateForMode(activeMode));
          } else {
            updateUI();
          }
        } catch (err) {
          el.trackName.textContent = audioBuffer ? el.trackName.textContent : '読込エラー';
          setStatusOverride('音声のデコードに失敗しました', 'err', 4500);
        }
      }

      function readFileAsArrayBuffer(file) {
        if (typeof file.arrayBuffer === 'function') {
          return file.arrayBuffer();
        }
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.onerror = () => reject(reader.error || new Error('File read failed'));
          reader.readAsArrayBuffer(file);
        });
      }

      function loadDemoAudio() {
        const ctx = ensureAudioContext();
        if (!ctx) return;

        immediateStop(true);
        audioBuffer = createDemoBuffer(ctx);
        isDemoLoaded = true;
        el.demoBtn.classList.add('active');
        el.trackName.textContent = 'Demo Synth Groove (120 BPM)';
        el.trackName.classList.add('loaded');
        setStatusOverride('デモ音源をロードしました', 'ok', 2200);

        if (activeMode === 0 && settings.zeroBehavior === 'stop') {
          activeMode = 1;
        }
        startPlaybackFromStandstill(getTargetRateForMode(activeMode));
      }

      // ---------- UI Helpers ----------
      function pulseAudioButtons() {
        el.fileLabel.classList.add('needs-audio');
        el.demoBtn.classList.add('needs-audio');
        setTimeout(() => {
          el.fileLabel.classList.remove('needs-audio');
          el.demoBtn.classList.remove('needs-audio');
        }, 900);
      }

      function setStatusOverride(msg, level, durationMs) {
        statusOverride = { msg, level };
        if (statusOverrideTimer) clearTimeout(statusOverrideTimer);
        updateAudioStatusUI();
        if (durationMs > 0) {
          statusOverrideTimer = setTimeout(() => {
            statusOverride = null;
            updateAudioStatusUI();
          }, durationMs);
        }
      }

      function updateAudioStatusUI() {
        if (statusOverride) {
          el.audioStatusText.textContent = statusOverride.msg;
          el.audioStatusText.className = `audio-status ${statusOverride.level || ''}`;
          return;
        }
        if (!audioCtx) {
          el.audioStatusText.textContent = 'AUDIO: TAP TO UNLOCK';
          el.audioStatusText.className = 'audio-status warn';
          el.statusLed.className = 'status-led';
          return;
        }
        const st = audioCtx.state;
        if (st === 'running') {
          el.audioStatusText.textContent = audioBuffer ? 'AUDIO: RUNNING' : 'AUDIO: READY';
          el.audioStatusText.className = 'audio-status ok';
          el.statusLed.className = playbackState === 'stopped' ? 'status-led running' : 'status-led playing';
        } else if (st === 'suspended' || st === 'interrupted') {
          el.audioStatusText.textContent = `AUDIO: ${st.toUpperCase()} (TAP)`;
          el.audioStatusText.className = 'audio-status warn';
          el.statusLed.className = 'status-led';
        } else {
          el.audioStatusText.textContent = `AUDIO: ${st.toUpperCase()}`;
          el.audioStatusText.className = 'audio-status';
          el.statusLed.className = 'status-led';
        }
      }

      function updateActiveAccentCss() {
        let color = 'var(--accent-0-stop)';
        if (activeMode === 0) {
          color = settings.zeroBehavior === 'normal' ? 'var(--accent-0-norm)' : 'var(--accent-0-stop)';
        } else if (activeMode === 1) {
          color = 'var(--accent-1)';
        } else if (activeMode === 2) {
          color = 'var(--accent-2)';
        } else if (activeMode === 3) {
          color = 'var(--accent-3)';
        }
        document.documentElement.style.setProperty('--active-color', color);
      }

      function formatTime(sec) {
        if (!Number.isFinite(sec) || sec < 0) return '00:00';
        const total = Math.floor(sec);
        const m = Math.floor(total / 60);
        const s = total % 60;
        return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
      }

      function updateUI() {
        updateActiveAccentCss();
        updateAudioStatusUI();

        // Mode pads active & labels
        el.pads[0].classList.toggle('is-normal-zero', settings.zeroBehavior === 'normal');
        for (let m = 0; m < 4; m++) {
          el.pads[m].classList.toggle('is-active', activeMode === m);
        }

        el.padRates[0].textContent = settings.zeroBehavior === 'normal' ? '1.00x' : '減速停止';
        el.padRates[1].textContent = `${settings.rates[1].toFixed(2)}x`;
        el.padRates[2].textContent = `${settings.rates[2].toFixed(2)}x`;
        el.padRates[3].textContent = `${settings.rates[3].toFixed(2)}x`;

        // Active mode badge & target
        const meta = MODE_META[activeMode];
        el.activeModeBadge.textContent = `[${activeMode}] ${meta.ja} / ${meta.en}`;
        if (activeMode === 0 && settings.zeroBehavior === 'stop') {
          el.targetRateText.textContent = playbackState === 'stopping' ? 'TARGET: BRAKING' : 'TARGET: STOP';
        } else {
          el.targetRateText.textContent = `TARGET: ${getTargetRateForMode(activeMode).toFixed(2)}x`;
        }

        // Play/Stop button
        const isPlayVisual = playbackState === 'playing';
        el.playStopBtn.textContent = isPlayVisual ? '■' : '▶';
        el.playStopBtn.classList.toggle('is-playing', isPlayVisual);

        // Toggle pills
        el.loopToggleBtn.textContent = settings.isLooping ? 'LOOP: ON' : 'LOOP: OFF';
        el.loopToggleBtn.classList.toggle('is-on', settings.isLooping);

        if (settings.zeroBehavior === 'normal') {
          el.zeroModeToggleBtn.textContent = '0(切): 1.0x通常';
          el.zeroModeToggleBtn.classList.add('zero-normal');
          el.zeroModeToggleBtn.classList.remove('zero-stop');
        } else {
          el.zeroModeToggleBtn.textContent = '0(切): 減速停止';
          el.zeroModeToggleBtn.classList.add('zero-stop');
          el.zeroModeToggleBtn.classList.remove('zero-normal');
        }

        // Sliders sync
        el.slider1.value = settings.rates[1].toFixed(2);
        el.slider2.value = settings.rates[2].toFixed(2);
        el.slider3.value = settings.rates[3].toFixed(2);
        el.sliderTau.value = settings.inertiaTau.toFixed(2);

        el.val1.textContent = `${settings.rates[1].toFixed(2)}x`;
        el.val2.textContent = `${settings.rates[2].toFixed(2)}x`;
        el.val3.textContent = `${settings.rates[3].toFixed(2)}x`;
        el.valTau.textContent = `${settings.inertiaTau.toFixed(2)}s`;
      }

      // ---------- Animation Frame Loop (Meters, Rotor, Progress) ----------
      function renderLoop(perfNow) {
        const dtPerf = Math.min(0.1, Math.max(0, (perfNow - lastFramePerf) / 1000));
        lastFramePerf = perfNow;

        const audioNow = audioCtx ? audioCtx.currentTime : 0;
        const currentRate = playbackState === 'stopped' ? 0 : getCurrentRate(audioNow);

        // Digital live rate readout
        el.liveRateText.textContent = currentRate.toFixed(2);

        // Tachometer arc & needle (0.0x -> -135 deg, 3.0x -> +135 deg)
        const ratio = clamp(currentRate / TACHO_MAX_RATE, 0, 1);
        const dashOffset = TACHO_ARC_LEN * (1 - ratio);
        el.tachoArc.setAttribute('stroke-dashoffset', dashOffset.toFixed(1));
        const needleDeg = -135 + ratio * 270;
        el.needleGroup.setAttribute('transform', `rotate(${needleDeg.toFixed(1)} 60 60)`);

        // Spinning platter angle proportional to instantaneous playbackRate
        if (currentRate > 0.002) {
          rotorAngle = (rotorAngle + currentRate * dtPerf * 240) % 360;
          el.rotorGroup.setAttribute('transform', `rotate(${rotorAngle.toFixed(1)} 60 60)`);
        }

        // Live audio output level ring via AnalyserNode
        let level = 0;
        if (analyser && analyserData && playbackState !== 'stopped') {
          analyser.getByteTimeDomainData(analyserData);
          let sumSq = 0;
          for (let i = 0; i < analyserData.length; i++) {
            const norm = (analyserData[i] - 128) / 128;
            sumSq += norm * norm;
          }
          const rms = Math.sqrt(sumSq / analyserData.length);
          level = clamp(rms * 2.4, 0, 1);
        }
        el.audioRing.setAttribute('stroke-dashoffset', (RING_LEN * (1 - level)).toFixed(1));

        // Track progress & time
        if (audioBuffer) {
          const pos = getLiveBufferOffset(audioNow);
          const dur = audioBuffer.duration;
          const pct = dur > 0 ? clamp((pos / dur) * 100, 0, 100) : 0;
          el.progressFill.style.width = `${pct.toFixed(1)}%`;
          el.timeReadout.textContent = `${formatTime(pos)} / ${formatTime(dur)}`;
        } else {
          el.progressFill.style.width = '0%';
          el.timeReadout.textContent = '00:00 / 00:00';
        }

        requestAnimationFrame(renderLoop);
      }

      // ---------- Event Wiring ----------
      function bindSlider(sliderEl, modeNum) {
        sliderEl.addEventListener('input', () => {
          ensureAudioContext();
          const val = clamp(parseFloat(sliderEl.value), 0.25, 3.0);
          settings.rates[modeNum] = val;
          saveSettings();
          updateUI();

          if (activeMode === modeNum && playbackState === 'playing' && currentSource) {
            rampPlaybackRate(val, Math.min(settings.inertiaTau, 0.04));
          }
        });
      }

      bindSlider(el.slider1, 1);
      bindSlider(el.slider2, 2);
      bindSlider(el.slider3, 3);

      el.sliderTau.addEventListener('input', () => {
        ensureAudioContext();
        const val = clamp(parseFloat(el.sliderTau.value), 0.02, 1.5);
        settings.inertiaTau = val;
        saveSettings();
        updateUI();

        if (playbackState === 'playing' && currentSource) {
          rampPlaybackRate(getTargetRateForMode(activeMode), val);
        } else if (playbackState === 'stopping' && currentSource && activeMode === 0 && settings.zeroBehavior === 'stop') {
          triggerSpinDownStop();
        }
      });

      el.resetBtn.addEventListener('click', () => {
        ensureAudioContext();
        settings = cloneDefaults();
        saveSettings();
        updateUI();
        if (playbackState === 'playing' && currentSource) {
          rampPlaybackRate(getTargetRateForMode(activeMode), settings.inertiaTau);
        } else if (playbackState === 'stopping' && currentSource && activeMode === 0 && settings.zeroBehavior === 'stop') {
          triggerSpinDownStop();
        }
      });

      // Loop toggle
      el.loopToggleBtn.addEventListener('click', () => {
        ensureAudioContext();
        if (audioCtx && audioBuffer && playbackState !== 'stopped') {
          // Commit buffer anchor before changing loop wrap rules
          commitRateAnchor(audioCtx.currentTime, rateTargetVal, rateTau);
        }
        settings.isLooping = !settings.isLooping;
        if (currentSource) {
          currentSource.loop = settings.isLooping;
        }
        saveSettings();
        updateUI();
      });

      // Mode 0 behavior toggle ('stop' vs 'normal' 1.0x)
      el.zeroModeToggleBtn.addEventListener('click', () => {
        ensureAudioContext();
        settings.zeroBehavior = settings.zeroBehavior === 'stop' ? 'normal' : 'stop';
        saveSettings();
        updateUI();
        if (activeMode === 0) {
          selectMode(0, 'toggle');
        }
      });

      // File picker & Demo synth
      el.fileLabel.addEventListener('pointerdown', () => ensureAudioContext());
      el.fileLabel.addEventListener('click', () => ensureAudioContext());
      el.fileInput.addEventListener('change', (e) => {
        const file = e.target.files && e.target.files[0];
        if (file) {
          handleFileSelection(file);
        }
        e.target.value = '';
      });

      el.demoBtn.addEventListener('click', () => loadDemoAudio());
      el.playStopBtn.addEventListener('click', () => toggleMasterPlayStop());

      // Large 2x2 Mode Pads (pointerdown for zero-latency iOS touch + keyboard Enter/Space click)
      for (let m = 0; m < 4; m++) {
        const pad = el.pads[m];
        let lastPointerTriggerAt = 0;
        pad.addEventListener('pointerdown', (e) => {
          e.preventDefault();
          lastPointerTriggerAt = performance.now();
          selectMode(m, 'pad');
        });
        pad.addEventListener('click', () => {
          // Avoid double-trigger after pointerdown; still allows keyboard activation
          if (performance.now() - lastPointerTriggerAt < 400) return;
          selectMode(m, 'pad');
        });
      }

      // Passive first-gesture audio unlock fallback
      const unlockOnGesture = () => {
        ensureAudioContext();
      };
      window.addEventListener('touchend', unlockOnGesture, { passive: true });
      window.addEventListener('click', unlockOnGesture, { passive: true });

      // Recover gracefully if iOS Safari interrupts audio when switching apps
      document.addEventListener('visibilitychange', () => {
        if (!document.hidden && audioCtx && audioCtx.state !== 'running') {
          audioCtx.resume().then(() => updateAudioStatusUI()).catch(() => {});
        }
      });

      // ---------- Bluetooth HID Keyboard Handling ----------
      function mapKeyEventToMode(e) {
        if (e.key === '0' || e.key === '０' || e.code === 'Digit0' || e.code === 'Numpad0') return 0;
        if (e.key === '1' || e.key === '１' || e.code === 'Digit1' || e.code === 'Numpad1') return 1;
        if (e.key === '2' || e.key === '２' || e.code === 'Digit2' || e.code === 'Numpad2') return 2;
        if (e.key === '3' || e.key === '３' || e.code === 'Digit3' || e.code === 'Numpad3') return 3;
        return null;
      }

      function showKeyDebug(e, matchedMode) {
        const keyLabel = e.key === ' ' ? 'Space' : (e.key || '?');
        const codeLabel = e.code ? ` [${e.code}]` : '';
        const statusTag = matchedMode !== null ? ` -> M${matchedMode}` : '';
        el.keyDebugText.textContent = `KEY: ${keyLabel}${codeLabel}${statusTag}`;

        el.keyDebug.classList.remove('flash-mapped', 'flash-unmapped');
        void el.keyDebug.offsetWidth;
        el.keyDebug.classList.add(matchedMode !== null ? 'flash-mapped' : 'flash-unmapped');

        if (keyFlashTimer) clearTimeout(keyFlashTimer);
        keyFlashTimer = setTimeout(() => {
          el.keyDebug.classList.remove('flash-mapped', 'flash-unmapped');
        }, 650);
      }

      window.addEventListener('keydown', (e) => {
        if (e.repeat) return;

        const mappedMode = mapKeyEventToMode(e);
        showKeyDebug(e, mappedMode);

        if (mappedMode !== null) {
          e.preventDefault();
          selectMode(mappedMode, 'hid');
        }
      });

      // Initialize UI and start render loop
      updateUI();
      requestAnimationFrame(renderLoop);
    })();
  </script>
</body>
</html>
