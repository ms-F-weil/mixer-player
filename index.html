<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0b0d11" />
  <title>BT Mixer Pitch Controller</title>
  <style>
    :root {
      --bg-chassis: #0b0d11;
      --bg-panel: #141922;
      --bg-panel-elev: #1b2230;
      --bg-well: #0d1118;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-strong: rgba(255, 255, 255, 0.16);
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;

      --accent-0-stop: #ef4444;
      --accent-0-norm: #38bdf8;
      --accent-1: #22d3ee;
      --accent-2: #f59e0b;
      --accent-3: #f43f5e;
      --accent-ok: #10b981;
      --accent-audius: #a855f7;
      --active-color: var(--accent-0-stop);

      --radius-lg: 14px;
      --radius-md: 10px;
      --radius-sm: 7px;
      --gap: clamp(4px, 0.95dvh, 8px);
      --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Segoe UI", sans-serif;
      --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background-color: var(--bg-chassis);
      color: var(--text-primary);
      font-family: var(--font-sans);
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      overscroll-behavior: none;
    }

    input[type="search"],
    input[type="text"],
    textarea {
      user-select: text;
      -webkit-user-select: text;
      -webkit-touch-callout: default;
      touch-action: manipulation;
    }

    button,
    label.btn {
      touch-action: manipulation;
    }

    .is-hidden {
      display: none !important;
    }

    .app-shell {
      height: 100vh;
      height: 100dvh;
      width: 100%;
      max-width: 540px;
      margin: 0 auto;
      padding:
        calc(5px + env(safe-area-inset-top))
        calc(9px + env(safe-area-inset-right))
        calc(5px + env(safe-area-inset-bottom))
        calc(9px + env(safe-area-inset-left));
      display: flex;
      flex-direction: column;
      gap: var(--gap);
      background:
        radial-gradient(circle at 50% -10%, rgba(56, 189, 248, 0.08), transparent 48%),
        linear-gradient(180deg, #0e1219 0%, #090b0f 100%);
    }

    .panel {
      background: linear-gradient(180deg, var(--bg-panel-elev) 0%, var(--bg-panel) 100%);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.05),
        0 6px 18px rgba(0, 0, 0, 0.4);
    }

    /* 1. Top Transport & File Bar */
    .topbar {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 5px 7px;
      min-height: 44px;
      flex-shrink: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 4px;
      padding-right: 2px;
      flex-shrink: 0;
    }

    .status-led {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #475569;
      box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.05);
      transition: background-color 0.2s, box-shadow 0.2s;
    }

    .status-led.running {
      background: var(--accent-ok);
      box-shadow: 0 0 8px rgba(16, 185, 129, 0.85);
    }

    .status-led.playing {
      background: var(--active-color);
      box-shadow: 0 0 10px var(--active-color);
    }

    .brand-title {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.06em;
      color: var(--text-secondary);
      white-space: nowrap;
    }

    .file-input-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .btn {
      appearance: none;
      border: 1px solid var(--border-strong);
      background: linear-gradient(180deg, #252e3f 0%, #1a212e 100%);
      color: var(--text-primary);
      font-family: inherit;
      font-size: 11px;
      font-weight: 700;
      border-radius: var(--radius-sm);
      padding: 5px 7px;
      height: 32px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      touch-action: manipulation;
      transition: transform 0.08s ease, border-color 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
    }

    .btn:active {
      transform: scale(0.96);
    }

    .btn.needs-audio {
      border-color: var(--accent-1);
      box-shadow: 0 0 12px rgba(34, 211, 238, 0.45);
    }

    .btn-demo {
      color: #cbd5e1;
      padding: 5px 7px;
    }

    .btn-demo.active {
      border-color: rgba(56, 189, 248, 0.55);
      color: #7dd3fc;
    }

    .track-pill {
      flex: 1;
      min-width: 0;
      height: 32px;
      background: var(--bg-well);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      padding: 2px 6px 2px 4px;
      display: flex;
      align-items: center;
      gap: 6px;
      overflow: hidden;
    }

    .now-art {
      width: 24px;
      height: 24px;
      border-radius: 4px;
      object-fit: cover;
      background: #1a212e;
      border: 1px solid rgba(255, 255, 255, 0.08);
      flex-shrink: 0;
    }

    .now-meta {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      line-height: 1.15;
    }

    .track-name {
      font-size: 11px;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
    }

    .track-name.loaded {
      color: var(--text-primary);
      font-weight: 700;
    }

    .track-artist {
      font-size: 9px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
    }

    .btn-transport {
      width: 34px;
      padding: 0;
      font-size: 13px;
      background: linear-gradient(180deg, #1f332c 0%, #13221d 100%);
      border-color: rgba(16, 185, 129, 0.45);
      color: #6ee7b7;
    }

    .btn-transport.is-playing {
      background: linear-gradient(180deg, #3b1d24 0%, #241116 100%);
      border-color: rgba(244, 63, 94, 0.55);
      color: #fda4af;
    }

    /* Compact Tab Bar */
    .tab-bar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 5px;
      padding: 3px;
      border-radius: var(--radius-md);
      flex-shrink: 0;
    }

    .tab-btn {
      appearance: none;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-secondary);
      font-family: inherit;
      font-size: 11px;
      font-weight: 800;
      border-radius: var(--radius-sm);
      height: 26px;
      padding: 0 6px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      cursor: pointer;
      white-space: nowrap;
      touch-action: manipulation;
      transition: background-color 0.15s, color 0.15s, border-color 0.15s;
    }

    .tab-btn:active {
      transform: scale(0.97);
    }

    .tab-btn.is-active {
      background: rgba(56, 189, 248, 0.14);
      border-color: rgba(56, 189, 248, 0.48);
      color: #e0f2fe;
    }

    .tab-btn[data-tab="audius"].is-active {
      background: rgba(168, 85, 247, 0.18);
      border-color: rgba(168, 85, 247, 0.55);
      color: #f3e8ff;
    }

    .tab-btn[data-tab="favorites"].is-active {
      background: rgba(245, 158, 11, 0.16);
      border-color: rgba(245, 158, 11, 0.52);
      color: #fef3c7;
    }

    /* Mixer Tab View */
    .tab-view-mixer {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: var(--gap);
    }

    /* 2. Meter & Options Deck */
    .deck {
      display: grid;
      grid-template-columns: minmax(98px, 116px) 1fr;
      gap: 9px;
      padding: clamp(6px, 1.1dvh, 10px) 10px;
      align-items: center;
      flex-shrink: 0;
    }

    .rotor-box {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      max-width: 112px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .rotor-svg {
      width: 100%;
      height: 100%;
      display: block;
      overflow: visible;
    }

    .deck-info {
      display: flex;
      flex-direction: column;
      gap: clamp(3px, 0.7dvh, 6px);
      min-width: 0;
    }

    .readout-row {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 6px;
    }

    .rate-main {
      display: flex;
      align-items: baseline;
      gap: 2px;
      line-height: 1;
    }

    .rate-value {
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
      font-size: clamp(26px, 4.8dvh, 34px);
      font-weight: 800;
      letter-spacing: -0.03em;
      color: var(--text-primary);
      text-shadow: 0 0 18px rgba(56, 189, 248, 0.25);
      text-shadow: 0 0 18px color-mix(in srgb, var(--active-color) 40%, transparent);
    }

    .rate-unit {
      font-family: var(--font-mono);
      font-size: 13px;
      font-weight: 700;
      color: var(--text-secondary);
    }

    .mode-meta {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 2px;
      min-width: 0;
    }

    .mode-badge {
      font-size: 10px;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 999px;
      border: 1px solid var(--active-color);
      border: 1px solid color-mix(in srgb, var(--active-color) 55%, transparent);
      background: #0b0d11;
      background: color-mix(in srgb, var(--active-color) 16%, #0b0d11);
      color: var(--text-primary);
      white-space: nowrap;
    }

    .target-sub {
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
      font-size: 10px;
      color: var(--text-secondary);
      white-space: nowrap;
    }

    .progress-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .progress-track {
      flex: 1;
      height: 5px;
      background: var(--bg-well);
      border-radius: 999px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent-1), var(--active-color));
      border-radius: 999px;
      transition: background 0.2s ease;
    }

    .time-readout {
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
      font-size: 10px;
      color: var(--text-secondary);
      white-space: nowrap;
    }

    .toggles-row {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 6px;
    }

    .pill-toggle {
      appearance: none;
      border: 1px solid var(--border-strong);
      background: var(--bg-well);
      color: var(--text-secondary);
      font-family: inherit;
      font-size: 11px;
      font-weight: 700;
      border-radius: var(--radius-sm);
      padding: 4px 8px;
      height: 27px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      touch-action: manipulation;
      transition: border-color 0.15s, color 0.15s, background-color 0.15s;
    }

    .pill-toggle:active {
      transform: scale(0.97);
    }

    .pill-toggle.is-on {
      border-color: rgba(34, 211, 238, 0.55);
      background: rgba(34, 211, 238, 0.12);
      color: #67e8f9;
    }

    .pill-toggle.zero-normal {
      border-color: rgba(56, 189, 248, 0.55);
      background: rgba(56, 189, 248, 0.12);
      color: #7dd3fc;
    }

    .pill-toggle.zero-stop {
      border-color: rgba(239, 68, 68, 0.45);
      background: rgba(239, 68, 68, 0.1);
      color: #fca5a5;
    }

    /* 3. 2x2 Large Hardware Mode Pads */
    .pads-grid {
      flex: 1;
      min-height: 116px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: var(--gap);
    }

    .mode-pad {
      --pad-color: var(--accent-0-stop);
      position: relative;
      appearance: none;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-lg);
      background: linear-gradient(180deg, #1d2432 0%, #121721 100%);
      color: var(--text-primary);
      padding: clamp(7px, 1.2dvh, 12px) 11px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: stretch;
      text-align: left;
      cursor: pointer;
      overflow: hidden;
      touch-action: manipulation;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.06),
        0 4px 12px rgba(0, 0, 0, 0.35);
      transition: transform 0.08s ease, border-color 0.16s ease, box-shadow 0.16s ease, background 0.16s ease;
    }

    .mode-pad:active {
      transform: scale(0.975);
    }

    .mode-pad[data-mode="0"] { --pad-color: var(--accent-0-stop); }
    .mode-pad[data-mode="0"].is-normal-zero { --pad-color: var(--accent-0-norm); }
    .mode-pad[data-mode="1"] { --pad-color: var(--accent-1); }
    .mode-pad[data-mode="2"] { --pad-color: var(--accent-2); }
    .mode-pad[data-mode="3"] { --pad-color: var(--accent-3); }

    .pad-led-bar {
      position: absolute;
      top: 0;
      left: 12px;
      right: 12px;
      height: 3px;
      border-radius: 0 0 4px 4px;
      background: #263042;
      background: color-mix(in srgb, var(--pad-color) 35%, #263042);
      transition: background-color 0.15s ease, box-shadow 0.15s ease;
    }

    .pad-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
    }

    .pad-key {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 5px;
      background: rgba(0, 0, 0, 0.42);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: var(--text-secondary);
    }

    .pad-rate {
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
      font-size: clamp(12px, 1.9dvh, 14px);
      font-weight: 700;
      color: var(--text-secondary);
    }

    .pad-center {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 6px;
      width: 100%;
    }

    .pad-label-ja {
      font-size: clamp(18px, 3dvh, 23px);
      font-weight: 900;
      letter-spacing: 0.02em;
      line-height: 1.1;
    }

    .pad-label-en {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.09em;
      color: var(--text-muted);
    }

    .mode-pad.is-active {
      border-color: var(--pad-color);
      background: linear-gradient(180deg, #232c3d 0%, #131823 100%);
      background: linear-gradient(
        180deg,
        color-mix(in srgb, var(--pad-color) 20%, #1b2230) 0%,
        color-mix(in srgb, var(--pad-color) 9%, #111620) 100%
      );
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.15),
        0 0 16px rgba(255, 255, 255, 0.12);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.15),
        0 0 18px color-mix(in srgb, var(--pad-color) 32%, transparent);
    }

    .mode-pad.is-active .pad-led-bar {
      background: var(--pad-color);
      box-shadow: 0 0 12px var(--pad-color);
    }

    .mode-pad.is-active .pad-key {
      border-color: var(--pad-color);
      border-color: color-mix(in srgb, var(--pad-color) 65%, transparent);
      color: var(--text-primary);
      background: #141a24;
      background: color-mix(in srgb, var(--pad-color) 26%, #0b0d11);
    }

    .mode-pad.is-active .pad-rate,
    .mode-pad.is-active .pad-label-en {
      color: var(--text-primary);
    }

    .mode-pad[data-mode="3"].is-active {
      animation: flashPulse 1.1s ease-in-out infinite;
    }

    @keyframes flashPulse {
      0%, 100% {
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.18),
          0 0 16px rgba(244, 63, 94, 0.35);
      }
      50% {
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.28),
          0 0 26px rgba(244, 63, 94, 0.68);
      }
    }

    /* 4. Real-Time Sliders Panel */
    .tuning-panel {
      padding: clamp(5px, 0.9dvh, 9px) 10px;
      display: flex;
      flex-direction: column;
      gap: clamp(3px, 0.65dvh, 6px);
      flex-shrink: 0;
    }

    .tuning-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .tuning-title {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.12em;
      color: var(--text-secondary);
    }

    .btn-reset {
      appearance: none;
      border: 1px solid var(--border-subtle);
      background: var(--bg-well);
      color: var(--text-secondary);
      font-family: inherit;
      font-size: 10px;
      font-weight: 700;
      border-radius: 5px;
      padding: 2px 7px;
      cursor: pointer;
      touch-action: manipulation;
    }

    .btn-reset:active {
      transform: scale(0.95);
    }

    .slider-row {
      display: grid;
      grid-template-columns: 78px 1fr 48px;
      align-items: center;
      gap: 8px;
      height: clamp(22px, 3.3dvh, 26px);
    }

    .slider-label {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .dot-1 { background: var(--accent-1); }
    .dot-2 { background: var(--accent-2); }
    .dot-3 { background: var(--accent-3); }
    .dot-tau { background: #a78bfa; }

    .slider {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 24px;
      background: transparent;
      margin: 0;
      touch-action: pan-x;
      cursor: pointer;
    }

    .slider:focus {
      outline: none;
    }

    .slider::-webkit-slider-runnable-track {
      height: 6px;
      border-radius: 999px;
      background: #0a0d13;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: linear-gradient(180deg, #f8fafc 0%, #cbd5e1 100%);
      border: 2px solid #0f172a;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.55);
      margin-top: -8px;
    }

    .slider::-moz-range-track {
      height: 6px;
      border-radius: 999px;
      background: #0a0d13;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .slider::-moz-range-thumb {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #f1f5f9;
      border: 2px solid #0f172a;
    }

    .slider-val {
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
      font-size: 11px;
      font-weight: 700;
      text-align: right;
      color: var(--text-primary);
    }

    /* Audius & Favorites Tab Views */
    .explore-panel {
      flex: 1;
      min-height: 0;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 7px;
      overflow: hidden;
    }

    .mini-mixer-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      padding: 4px 7px;
      background: var(--bg-well);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      flex-shrink: 0;
    }

    .mini-rate-info {
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-primary);
      white-space: nowrap;
    }

    .mini-mode-btns {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .mini-mode-btn {
      appearance: none;
      border: 1px solid var(--border-strong);
      background: #18202c;
      color: var(--text-secondary);
      font-family: inherit;
      font-size: 10px;
      font-weight: 800;
      border-radius: 5px;
      padding: 3px 7px;
      height: 24px;
      cursor: pointer;
      touch-action: manipulation;
    }

    .list-status {

      align-items: center;
      justify-content: space-between;
      gap: 6px;
      flex-shrink: 0;
      min-height: 18px;

    .list-status.err {
      color: #fca5a5;
    }

    .list-status.ok {
      color: #6ee7b7;
    }

    .track-list {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding-right: 2px;
      touch-action: pan-y;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
    }

    .track-row {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 6px 8px;
      border-radius: var(--radius-md);
      background: var(--bg-well);
      border: 1px solid var(--border-subtle);
      cursor: pointer;
      touch-action: manipulation;
      text-align: left;
      width: 100%;
      flex-shrink: 0;
      transition: border-color 0.14s, background-color 0.14s;

    .track-row:active {
      transform: scale(0.99);
    }

    .track-row.is-playing {
      border-color: var(--accent-1);
      background: rgba(34, 211, 238, 0.1);
    }

    .track-row.is-loading {

    .row-art {

      color: var(--text-secondary);

    .fav-btn {

</head>
<body>
  <main class="app-shell">

  <script>
    (() => {
      'use strict';

      // Configure iOS 17+ AudioSession so Web Audio plays with silent switch ON and routes cleanly to BT speakers.
      if ('audioSession' in navigator) {
        try {
          navigator.audioSession.type = 'playback';
        } catch (_) {}
      }

      const STORAGE_KEY = 'bt_mixer_pitch_settings_v1';
      const FAVORITES_STORAGE_KEY = 'bt_mixer_audius_favorites_v1';
      const AUDIUS_APP_NAME = 'mixer_player';
      const AUDIUS_DISCOVERY_API = 'https://api.audius.co';
      const AUDIUS_FALLBACK_HOST = 'https://discoveryprovider.audius.co';
      const MAX_AUDIUS_DURATION_SEC = 900;

      const PRESET_GENRES = [
        { id: 'trending', label: 'Trending', genre: '', fallbackQuery: '' },
        { id: 'electronic', label: 'Electronic', genre: 'Electronic', fallbackQuery: 'Electronic' },
        { id: 'hiphop', label: 'Hip-Hop', genre: 'Hip-Hop/Rap', fallbackQuery: 'Hip-Hop' },
        { id: 'house', label: 'House', genre: 'House', fallbackQuery: 'House' },
        { id: 'lofi', label: 'Lo-Fi', genre: 'Lo-Fi', fallbackQuery: 'Lo-Fi' },
        { id: 'techno', label: 'Techno', genre: 'Techno', fallbackQuery: 'Techno' },
        { id: 'dnb', label: 'Drum & Bass', genre: 'Drum & Bass', fallbackQuery: 'Drum & Bass' },
        { id: 'ambient', label: 'Ambient', genre: 'Ambient', fallbackQuery: 'Ambient' }
      ];

      // ---------- Settings & Favorites Persistence ----------
      function cloneDefaults() {
        return {
          rates: { ...DEFAULTS.rates },
          inertiaTau: DEFAULTS.inertiaTau,
          isLooping: DEFAULTS.isLooping,
          zeroBehavior: DEFAULTS.zeroBehavior
        };
      }

      function clamp(val, min, max) {
        return Math.min(max, Math.max(min, val));
      }

      function loadSettings() {
        const base = cloneDefaults();
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return base;
          const parsed = JSON.parse(raw);
          if (parsed && typeof parsed === 'object') {
            if (parsed.rates) {
              for (const k of [1, 2, 3]) {
                const v = Number(parsed.rates[k]);
                if (Number.isFinite(v)) base.rates[k] = clamp(v, 0.25, 3.0);
              }
            }
            const tau = Number(parsed.inertiaTau);
            if (Number.isFinite(tau)) base.inertiaTau = clamp(tau, 0.02, 1.5);
            if (typeof parsed.isLooping === 'boolean') base.isLooping = parsed.isLooping;
            if (parsed.zeroBehavior === 'stop' || parsed.zeroBehavior === 'normal') {
              base.zeroBehavior = parsed.zeroBehavior;
            }
          }
        } catch (_) {}
        return base;
      }

      function saveSettings() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(settings));
        } catch (_) {}
      }

      function sanitizeArtworkUrl(url) {
        if (typeof url === 'string' && /^https:\/\//i.test(url.trim())) {
          return url.trim();
        }
        return PLACEHOLDER_ART_URI;
      }

      function normalizeTrack(raw) {
        if (!raw || !raw.id) return null;
        const duration = Number(raw.duration);
        return {
          id: String(raw.id),
          title: String(raw.title || 'Untitled Track'),
          artist: String((raw.user && raw.user.name) || raw.artist || 'Unknown Artist'),
          artwork: sanitizeArtworkUrl(
            typeof raw.artwork === 'string'
              ? raw.artwork
              : (raw.artwork && (raw.artwork['150x150'] || raw.artwork['480x480'] || raw.artwork['1000x1000']))
          ),
          duration: Number.isFinite(duration) && duration >= 0 ? duration : 0
        };
      }

      function loadFavorites() {
        try {
          const raw = localStorage.getItem(FAVORITES_STORAGE_KEY);
          if (!raw) return [];
          const parsed = JSON.parse(raw);
          if (!Array.isArray(parsed)) return [];
          return parsed.map(normalizeTrack).filter(Boolean);
        } catch (_) {
          return [];
        }
      }

      function saveFavorites() {
        try {
          localStorage.setItem(FAVORITES_STORAGE_KEY, JSON.stringify(favorites));
        } catch (_) {}

      function isFavoriteTrack(trackId) {
        return favorites.some((t) => t.id === String(trackId));

      function toggleFavorite(track) {
        const norm = normalizeTrack(track);
        if (!norm) return;
        const idx = favorites.findIndex((t) => t.id === norm.id);
        if (idx >= 0) {
          favorites.splice(idx, 1);
        } else {
          favorites.unshift({
            id: norm.id,
            title: norm.title,
            artist: norm.artist,
            artwork: norm.artwork,
            duration: norm.duration
          });

        saveFavorites();
        updateFavoritesUI();
